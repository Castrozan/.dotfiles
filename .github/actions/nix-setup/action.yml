name: Nix setup
description: Install Nix and restore the store cache for one Nix Lint job.

inputs:
  cache-key:
    description: >-
      Job-scoped segment of the cache key. Each job caches only the store paths it actually touches,
      so a restore stays smaller than one shared cache covering every job at once.
    required: true
  github-token:
    description: >-
      Token used when fetching flake inputs, so GitHub API rate limits do not fail a run.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token }}

    - name: Configure the signed Devenv cache
      shell: bash
      run: |
        cache_configuration=machine-configuration/development/development-environments/devenv-cache.json
        mkdir -p "$HOME/.config/nix"
        printf 'extra-substituters = %s\nextra-trusted-public-keys = %s\n' \
          "$(jq -er .cacheUrl "$cache_configuration")" \
          "$(jq -er .publicKey "$cache_configuration")" >> "$HOME/.config/nix/nix.conf"

    # Keeping the cache configuration in one place matters more than the indirection costs: a key
    # that drifts between jobs turns every restore into a silent miss, which reads as a slow run
    # rather than as a broken cache.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-native-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('flake.lock', 'agent-harness/harnesses/codex/package.nix', 'agent-harness/harnesses/codex/status-line/**', 'repository/nix-library/fetch-prebuilt-binary.nix', 'machine-configuration/development/local-language-models/**') }}
        restore-prefixes-first-match: |
          nix-native-${{ runner.os }}-${{ inputs.cache-key }}-
          nix-${{ runner.os }}-${{ inputs.cache-key }}-
        paths: |
          ~/.cache/nix
        purge: false
