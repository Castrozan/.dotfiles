name: Nix setup
description: Install Nix and restore the store cache for one Nix Lint job.

inputs:
  cache-key:
    description: >-
      Job-scoped segment of the cache key. Only flake-check restores and saves a store archive;
      other jobs use their configured Nix substituters.
    required: true
  github-token:
    description: >-
      Token used when fetching flake inputs, so GitHub API rate limits do not fail a run.
    required: true
  nix-distribution:
    description: >-
      upstream installs Nix from nixos.org; determinate installs Determinate Nix, whose evaluator
      checks flake outputs in parallel across the runner's cores.
    required: false
    default: upstream

runs:
  using: composite
  steps:
    - uses: ./.github/actions/nix-build-space
      if: ${{ inputs.cache-key == 'flake-check' }}

    - name: Stub the private arr-stack input
      shell: bash
      run: printf 'ARR_STACK_STUB_OVERRIDE=--override-input dependencies/arr-stack path:%s/repository/verification/nix-checks/arr-stack-stub\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    - name: Stub the private darwin assets input
      shell: bash
      run: printf 'PRIVATE_CONFIG_STUB_OVERRIDE=--override-input dependencies/private-config path:%s/repository/verification/nix-checks/private-config-stub\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      if: ${{ inputs.nix-distribution == 'upstream' }}
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token }}

    - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3
      if: ${{ inputs.nix-distribution == 'determinate' }}
      with:
        diagnostic-endpoint: ""
        summarize: false
        extra-conf: |
          eval-cores = 0
          lazy-trees = false
          access-tokens = github.com=${{ inputs.github-token }}

    - name: Configure the signed Devenv binary cache
      shell: bash
      run: |
        devenv_cache_configuration=machine-configuration/development/development-environments/devenv-cache.json
        mkdir -p "$HOME/.config/nix"
        printf 'extra-substituters = %s\nextra-trusted-public-keys = %s\n' \
          "$(jq -er .cacheUrl "$devenv_cache_configuration")" \
          "$(jq -er .publicKey "$devenv_cache_configuration")" >> "$HOME/.config/nix/nix.conf"

    - name: Identify the store cache week
      id: store-cache-week
      if: ${{ inputs.cache-key == 'flake-check' }}
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    # Keeping the cache configuration in one place matters more than the indirection costs: a key
    # that drifts between jobs turns every restore into a silent miss, which reads as a slow run
    # rather than as a broken cache.
    - uses: nix-community/cache-nix-action@v7
      if: ${{ inputs.cache-key == 'flake-check' }}
      with:
        primary-key: nix-native-${{ runner.os }}-${{ inputs.cache-key }}-${{ inputs.nix-distribution }}-${{ steps.store-cache-week.outputs.week }}-${{ hashFiles('flake.lock', 'agent-harness/harnesses/codex/package/unwrapped.nix', 'repository/nix-library/fetch-prebuilt-binary.nix', 'machine-configuration/development/local-language-models/**') }}
        restore-prefixes-first-match: |
          nix-native-${{ runner.os }}-${{ inputs.cache-key }}-${{ inputs.nix-distribution }}-
          nix-native-${{ runner.os }}-${{ inputs.cache-key }}-
          nix-${{ runner.os }}-${{ inputs.cache-key }}-
        paths: |
          ~/.cache/nix
        save: ${{ github.ref == 'refs/heads/main' }}
        gc-max-store-size-linux: 7G
        purge: false
