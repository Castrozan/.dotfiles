name: Nix Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: lint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-input-key: ${{ secrets.ARR_STACK_DEPLOY_KEY }}

      - name: statix
        if: ${{ !cancelled() }}
        run: nix run nixpkgs#statix -- check . --ignore 'result*'

      - name: deadnix
        if: ${{ !cancelled() }}
        run: nix run nixpkgs#deadnix -- .

      - name: nixfmt
        if: ${{ !cancelled() }}
        run: |
          find . -name '*.nix' -not -path './result*' \
            -exec nix run nixpkgs#nixfmt-rfc-style -- --check {} +

      - name: Flake metadata (syntax check)
        if: ${{ !cancelled() }}
        run: nix flake metadata

  # These three evaluate the tree independently and used to run back to back inside the lint job,
  # so the run cost their sum. As separate jobs they cost only the slowest of them, and a failure
  # in one still reports the other two rather than hiding them.
  evaluate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nix flake checks
            cache-key: flake-check
            command: nix flake check --keep-going --print-build-logs --show-trace

          - name: Darwin eval-assertion checks
            cache-key: darwin-eval
            command: |
              nix eval --raw --show-trace '.#checks.aarch64-darwin' \
                --apply 'checks: builtins.concatStringsSep "\n" (builtins.attrValues (builtins.mapAttrs (name: check: check.name) checks))'

          - name: NixOS assertions (dry eval)
            cache-key: nixos-eval
            command: nix build .#nixosConfigurations.chise.config.system.build.toplevel --dry-run 2>&1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: ${{ matrix.cache-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-input-key: ${{ secrets.ARR_STACK_DEPLOY_KEY }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Retain native package outputs for the store cache
        if: ${{ matrix.cache-key == 'flake-check' }}
        run: |
          nix build --out-link "$RUNNER_TEMP/native-cache-package" \
            .#nixosConfigurations.chise.config.home-manager.users.zanoni.codex.unwrappedPackage \
            .#checks.x86_64-linux.domain-local-model-tokenizer-long-input.tokenizerPackage

  gate:
    name: Nix Lint
    needs: [lint, evaluate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require all Nix checks to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          EVALUATION_RESULT: ${{ needs.evaluate.result }}
        run: test "$LINT_RESULT" = success && test "$EVALUATION_RESULT" = success
