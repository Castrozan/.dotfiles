name: Nix Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every main push still gets its own verdict, because main is the test gate. Superseded pull
  # request runs are dropped instead of queueing behind the run they already replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Nix Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Magic Nix Cache is retired: it reaches a GitHub cache endpoint that now answers 400 and
      # falls back to FlakeHub, which needs a token this repository does not hold, so every run
      # refetched every flake input from scratch. This caches the store and the fetcher cache
      # against the resolved lock, and keeps one cache per ref so storage stays bounded.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('repository/flake-assembly/dependencies/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          paths: |
            ~/.cache/nix
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: statix
        if: ${{ !cancelled() }}
        run: nix run nixpkgs#statix -- check . --ignore 'result*'

      - name: deadnix
        if: ${{ !cancelled() }}
        run: nix run nixpkgs#deadnix -- .

      - name: nixfmt
        if: ${{ !cancelled() }}
        run: |
          find . -name '*.nix' -not -path './result*' \
            -exec nix run nixpkgs#nixfmt-rfc-style -- --check {} +

      - name: Flake metadata (syntax check)
        if: ${{ !cancelled() }}
        run: nix flake metadata

      - name: Nix flake checks
        if: ${{ !cancelled() }}
        run: nix flake check --keep-going --print-build-logs --show-trace

      - name: Darwin eval-assertion checks
        if: ${{ !cancelled() }}
        run: |
          nix eval --raw --show-trace '.#checks.aarch64-darwin' \
            --apply 'checks: builtins.concatStringsSep "\n" (builtins.attrValues (builtins.mapAttrs (name: check: check.name) checks))'

      - name: NixOS assertions (dry eval)
        if: ${{ !cancelled() }}
        run: |
          nix build .#nixosConfigurations.chise.config.system.build.toplevel --dry-run 2>&1
