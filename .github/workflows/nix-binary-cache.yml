name: Nix binary cache

on:
  push:
    paths:
      - flake.lock
      - repository/flake-assembly/**
      - machine-configuration/development/testing/**
      - agent-harness/quality/evaluations/instructions/python-packages.nix
      - agent-harness/quality/evaluations/instructions/github-slugger-python-package.nix
      - machine-configuration/media/media-generation/image-python-packages.nix
      - machine-configuration/development/cloud-services/agent-api/python-packages.nix
      - machine-configuration/media/media-generation/video-ffmpeg-package.nix
      - machine-configuration/terminal/workspace-manager/herdr/**
      - machine-configuration/terminal/emulators/wezterm/patched-wezterm.nix
      - machine-configuration/terminal/emulators/wezterm/wezterm-patches/**
      - agent-harness/harnesses/codex/package/unwrapped.nix
      - agent-harness/harnesses/codex/status-line/**
      - repository/nix-library/fetch-prebuilt-binary.nix
      - machine-configuration/development/system-rebuild/dotfiles-binary-cache.json
      - .github/workflows/nix-binary-cache.yml
      - .github/actions/nix-setup/**
  workflow_dispatch: {}

concurrency:
  group: nix-binary-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'Castrozan/.dotfiles' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: binary-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-input-key: ${{ secrets.ARR_STACK_DEPLOY_KEY }}

      - name: Configure the signed binary cache
        run: |
          cache_configuration=machine-configuration/development/system-rebuild/dotfiles-binary-cache.json
          cache_url=$(jq -er .url "$cache_configuration")
          cache_public_key=$(jq -er .publicKey "$cache_configuration")
          mkdir -p "$HOME/.config/nix"
          printf 'extra-substituters = %s\nextra-trusted-public-keys = %s\n' \
            "$cache_url" "$cache_public_key" >> "$HOME/.config/nix/nix.conf"

      - name: Verify the exported derivations match the deployed packages
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'packages: builtins.mapAttrs (_: package: package.drvPath) packages' \
            > exported-derivations.json
          deployed_generation=$(nix eval --raw .#nixosConfigurations.chise.config.home-manager.users.zanoni.home.activationPackage.drvPath)
          nix-store --query --requisites "$deployed_generation" | jq -R . | jq -s . > deployed-derivations.json
          jq -e --slurp '([.[0][]] - .[1]) == []' \
            exported-derivations.json deployed-derivations.json

      - name: Build the patched packages and Python test environment
        run: |
          cached_packages=(herdr herdr-agent-resume herdr-annotate codex wezterm)
          nix build "${cached_packages[@]/#/.#packages.$NIX_SYSTEM.}" \
            --no-link --print-build-logs --json > binary-cache-packages.json
          if [ "$NIX_SYSTEM" != x86_64-linux ]; then
            exit 0
          fi
          nix build --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in import ./machine-configuration/development/testing/test-suite-environment.nix { inherit pkgs; }' \
            --no-link --print-build-logs --max-silent-time 1200 --json > binary-cache-test-environment.json
          jq --slurp add binary-cache-packages.json binary-cache-test-environment.json > binary-cache-complete.json
          mv binary-cache-complete.json binary-cache-packages.json

      - name: Upload the package identities
        uses: actions/upload-artifact@v4
        with:
          name: binary-cache-packages-${{ matrix.system }}
          path: |
            binary-cache-packages.json
            binary-cache-test-environment.json
            exported-derivations.json
            deployed-derivations.json

      - name: Sign the binary cache
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          umask 077
          cache_key_file="$RUNNER_TEMP/nix-cache-signing-key"
          trap 'rm -f "$cache_key_file"' EXIT
          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$cache_key_file"
          expected_public_key=$(jq -er .publicKey machine-configuration/development/system-rebuild/dotfiles-binary-cache.json)
          test "$(nix key convert-secret-to-public < "$cache_key_file")" = "$expected_public_key"
          package_outputs=()
          while IFS= read -r package_output; do
            package_outputs+=("$package_output")
          done < <(jq -r '.[].outputs[]' binary-cache-packages.json)
          nix copy --to "file://$RUNNER_TEMP/nix-binary-cache?secret-key=$cache_key_file&compression=zstd" \
            "${package_outputs[@]}"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/933601426694/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: dotfiles-github-deployer@zg-url-shortener-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Publish NARs before signed metadata
        run: |
          cache_bucket=$(jq -er .bucketUri machine-configuration/development/system-rebuild/dotfiles-binary-cache.json)
          gcloud storage rsync "$RUNNER_TEMP/nix-binary-cache/nar" "$cache_bucket/nar" --recursive
          gcloud storage rsync "$RUNNER_TEMP/nix-binary-cache" "$cache_bucket" --exclude='^nar/'

  substitute:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Realize the packages from signed substitutes on a fresh runner
        run: |
          cache_configuration=machine-configuration/development/system-rebuild/dotfiles-binary-cache.json
          cache_url=$(jq -er .url "$cache_configuration")
          cache_public_key=$(jq -er .publicKey "$cache_configuration")
          cached_packages=(herdr herdr-agent-resume herdr-annotate codex wezterm)
          nix build "${cached_packages[@]/#/.#packages.$NIX_SYSTEM.}" \
            --no-link --print-build-logs --json --max-jobs 0 \
            --option substituters "$cache_url https://cache.nixos.org" \
            --extra-trusted-public-keys "$cache_public_key" > binary-cache-substitutions.json

      - uses: actions/upload-artifact@v4
        with:
          name: binary-cache-substitutions-${{ matrix.system }}
          path: binary-cache-substitutions.json

      - name: Copy the exact Python test environment from the signed cache
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: |
          cache_configuration=machine-configuration/development/system-rebuild/dotfiles-binary-cache.json
          cache_url=$(jq -er .url "$cache_configuration")
          cache_public_key=$(jq -er .publicKey "$cache_configuration")
          test_environment_output=$(nix eval --impure --raw --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in (import ./machine-configuration/development/testing/test-suite-environment.nix { inherit pkgs; }).outPath')
          nix copy --from "$cache_url" "$test_environment_output" \
            --extra-trusted-public-keys "$cache_public_key"
          nix build --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in import ./machine-configuration/development/testing/test-suite-environment.nix { inherit pkgs; }' \
            --always-allow-substitutes --max-jobs 0 --no-link --json \
            --option substituters "$cache_url https://cache.nixos.org" \
            --extra-trusted-public-keys "$cache_public_key" > binary-cache-test-environment-substitutions.json

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.system == 'x86_64-linux' }}
        with:
          name: binary-cache-test-environment-substitutions
          path: binary-cache-test-environment-substitutions.json
