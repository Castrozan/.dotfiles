name: deploy reports

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

concurrency:
  group: reports-overview
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  quality-overview:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    uses: ./.github/workflows/publish-quality-overview.yml
    secrets: inherit
