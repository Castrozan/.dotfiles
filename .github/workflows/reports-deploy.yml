name: deploy reports

on:
  workflow_dispatch:
    inputs:
      producing_run_id:
        description: Retained completed main-push tests run to publish
        required: true
        type: string
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

concurrency:
  group: reports-overview
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  quality-overview:
    permissions:
      contents: read
      actions: read
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    uses: ./.github/workflows/publish-quality-overview.yml
    secrets: inherit
