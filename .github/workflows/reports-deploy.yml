name: deploy reports

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: reports-deploy
  cancel-in-progress: true

env:
  GCP_PROJECT: zg-url-shortener-2026

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: cachix/install-nix-action@v31

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build coverage report
        run: |
          find agent-harness machine-configuration -path "*/scripts/*" -type f -exec chmod +x {} +
          nix shell nixpkgs#kcov nixpkgs#bats nixpkgs#bc --command ./repository/verification/cover/bash-coverage.sh --ci

      - name: Assemble published artifacts
        run: |
          mkdir -p agent-harness/measurement-and-reporting/reports/site/quality
          cp -r repository/verification/coverage agent-harness/measurement-and-reporting/reports/site/coverage
          python3 agent-harness/quality/evaluations/render_baseline_dashboard.py agent-harness/measurement-and-reporting/reports/site/baseline
          cp .github/pages/style.css agent-harness/measurement-and-reporting/reports/site/baseline/style.css
          python3 agent-harness/quality/evaluations/render_quality_metrics.py agent-harness/measurement-and-reporting/reports/site/quality/metrics.json

      - name: Publish the test baseline, coverage and quality snapshots to the ingestion api
        if: ${{ vars.INGEST_BASE_URL != '' }}
        env:
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
          INGEST_PRODUCER_LABEL: dotfiles-github-actions
        run: |
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_test_baseline_snapshot.py
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_test_coverage_snapshot.py \
            "$(find repository/verification/coverage -name coverage.json -print -quit)"
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_test_quality_snapshot.py \
            agent-harness/measurement-and-reporting/reports/site/quality/metrics.json

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/933601426694/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: dotfiles-github-deployer@zg-url-shortener-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish baseline, coverage and quality metrics to the usage snapshots bucket
        if: ${{ vars.REPORTS_STATIC_GCS_PUBLISH == 'true' }}
        run: |
          BUCKET="gs://${GCP_PROJECT}-dotfiles-usage-snapshots"
          gcloud storage rsync agent-harness/measurement-and-reporting/reports/site/baseline "${BUCKET}/reports/baseline" \
            --recursive --delete-unmatched-destination-objects
          gcloud storage rsync agent-harness/measurement-and-reporting/reports/site/coverage "${BUCKET}/reports/coverage" \
            --recursive --delete-unmatched-destination-objects
          gcloud storage rsync agent-harness/measurement-and-reporting/reports/site/quality "${BUCKET}/reports/quality" \
            --recursive --delete-unmatched-destination-objects
