name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run quick tests
        run: ./__tests__/run.sh --ci

  qml-and-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run Python tests
        if: ${{ !cancelled() }}
        run: |
          nix shell --impure --expr 'let pkgs = (builtins.getFlake "nixpkgs").legacyPackages.${builtins.currentSystem}; in import ./home/base/testing/test-suite-environment.nix { inherit pkgs; }' --command bash -c '
            export REPO_DIR="$PWD"
            source __tests__/lib/discovery.sh
            source __tests__/lib/pytest.sh
            unitExitCode=0
            _run_pytest_tier unit quick || unitExitCode=$?
            integrationExitCode=0
            _run_pytest_tier integration integration-scripts || integrationExitCode=$?
            exit $(( unitExitCode > integrationExitCode ? unitExitCode : integrationExitCode ))
          '

      - name: Run QML unit tests
        if: ${{ !cancelled() }}
        run: |
          nix shell nixpkgs#qt6.qtdeclarative --command bash -c '
            export QT_DECLARATIVE_PATH=$(dirname $(dirname $(which qmltestrunner)))
            bash home/linux/hyprland/__tests__/qml/run-qml-tests.sh
          '
