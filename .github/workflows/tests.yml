name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTFILES_TEST_REPORT_DIRECTORY: ${{ github.workspace }}/.quality-results

jobs:
  quality-evidence:
    uses: ./.github/workflows/quality-evidence.yml

  local-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
        with:
          cache-key: local-lint
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the same local quality gate used by agents
        run: |
          lintPackage=$(nix build --no-link --print-out-paths --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in (import ./machine-configuration/development/testing/local-lint/local-lint-tools.nix { inherit pkgs; }).lint')
          "$lintPackage/bin/dotfiles-lint" --all --output .quality-results/local-lint.json
      - name: Retain local lint findings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-lint
          path: .quality-results/local-lint.json
          include-hidden-files: true
          if-no-files-found: error

  quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run quick tests
        run: ./repository/verification/run.sh --ci

      - name: Retain native Bats test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bats-junit
          path: .quality-results/bats-*/report.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce directory entry limits
        if: ${{ !cancelled() }}
        run: python3 repository/verification/quality/directory-entries/check.py

  swift-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Run Swift tests with native coverage
        run: |
          nix shell --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in pkgs.python312.withPackages (packages: [ packages.coverage ])' --command bash -e -c '
            mkdir -p .coverage-reports
            python3 -m coverage run --rcfile=repository/verification/cover/coverage.ini repository/verification/cover/swift-coverage.py
            python3 -m coverage combine --rcfile=repository/verification/cover/coverage.ini
            python3 -m coverage xml --rcfile=repository/verification/cover/coverage.ini -o .coverage-reports/swift-runner-coverage.xml
          '
      - name: Upload Swift coverage
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: |
            .coverage-reports/swift-coverage.xml
            .coverage-reports/swift-runner-coverage.xml
          if-no-files-found: error

  bash-coverage:
    uses: ./.github/workflows/coverage.yml

  python-tests:
    uses: ./.github/workflows/python-tests.yml

  qml-tests:
    uses: ./.github/workflows/qml-tests.yml

  qml-and-python-tests:
    needs: [swift-tests, python-tests, qml-tests, bash-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Download Python unit evidence
        if: ${{ !cancelled() && needs.python-tests.outputs.unit-artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.python-tests.outputs.unit-artifact-id }}
          path: .quality-results/python-shards/python-shard-unit-0-${{ needs.python-tests.outputs.unit-artifact-attempt }}
          merge-multiple: true

      - name: Download Python integration-first evidence
        if: ${{ !cancelled() && needs.python-tests.outputs.integration-first-artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.python-tests.outputs.integration-first-artifact-id }}
          path: .quality-results/python-shards/python-shard-integration-0-${{ needs.python-tests.outputs.integration-first-artifact-attempt }}
          merge-multiple: true

      - name: Download Python integration-second evidence
        if: ${{ !cancelled() && needs.python-tests.outputs.integration-second-artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.python-tests.outputs.integration-second-artifact-id }}
          path: .quality-results/python-shards/python-shard-integration-1-${{ needs.python-tests.outputs.integration-second-artifact-attempt }}
          merge-multiple: true

      - name: Combine Python evidence
        if: ${{ !cancelled() }}
        run: |
          nix shell --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in pkgs.python312.withPackages (packages: [ packages.coverage packages.defusedxml ])' --command \
            python3 repository/verification/runner/python/merge-python-evidence.py .quality-results/python-shards . \
              "${{ needs.python-tests.outputs.unit-artifact-attempt || github.run_attempt }}" \
              "${{ needs.python-tests.outputs.integration-first-artifact-attempt || github.run_attempt }}" \
              "${{ needs.python-tests.outputs.integration-second-artifact-attempt || github.run_attempt }}"

      - name: Retain native Python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-junit
          path: |
            .quality-results/pytest-*.xml
            .quality-results/shard-diagnostics/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Python coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: .coverage-reports/python-coverage.xml
          if-no-files-found: error

      - name: Download Swift coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: swift-coverage
          path: .coverage-reports

      - name: Enforce local coverage of changed lines
        if: ${{ !cancelled() }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          coveragePackage=$(nix build --no-link --print-out-paths --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in (import ./machine-configuration/development/testing/local-lint/local-lint-tools.nix { inherit pkgs; }).coverage')
          "$coveragePackage/bin/dotfiles-coverage-check" .coverage-reports/python-coverage.xml .coverage-reports/swift-runner-coverage.xml .coverage-reports/swift-coverage.xml --compare-branch "$COVERAGE_BASE"

      - name: Require every test producer to succeed
        if: ${{ always() }}
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          QML_RESULT: ${{ needs.qml-tests.result }}
          SWIFT_RESULT: ${{ needs.swift-tests.result }}
          BASH_COVERAGE_RESULT: ${{ needs.bash-coverage.result }}
        run: test "$PYTHON_RESULT" = success && test "$QML_RESULT" = success && test "$SWIFT_RESULT" = success && test "$BASH_COVERAGE_RESULT" = success
