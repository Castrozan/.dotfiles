name: tests
on:
  push:
    branches: [main]
  pull_request:

env:
  DOTFILES_TEST_REPORT_DIRECTORY: ${{ github.workspace }}/.quality-results

jobs:
  quality-evidence:
    uses: ./.github/workflows/quality-evidence.yml

  local-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
        with:
          cache-key: local-lint
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the same local quality gate used by agents
        run: |
          lintPackage=$(nix build --no-link --print-out-paths --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in (import ./machine-configuration/development/testing/local-lint/local-lint-tools.nix { inherit pkgs; }).lint')
          "$lintPackage/bin/dotfiles-lint" --all --output .quality-results/local-lint.json
      - name: Retain local lint findings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-lint
          path: .quality-results/local-lint.json
          include-hidden-files: true
          if-no-files-found: error

  quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run quick tests
        run: ./repository/verification/run.sh --ci

      - name: Retain native Bats test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bats-junit
          path: .quality-results/bats-*/report.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce directory entry limits
        if: ${{ !cancelled() }}
        run: python3 repository/verification/quality/directory-entries/check.py

  swift-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Run Swift tests with native coverage
        run: |
          nix shell --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in pkgs.python312.withPackages (packages: [ packages.coverage ])' --command bash -e -c '
            mkdir -p .coverage-reports
            python3 -m coverage run --rcfile=repository/verification/cover/coverage.ini repository/verification/cover/swift-coverage.py
            python3 -m coverage combine --rcfile=repository/verification/cover/coverage.ini
            python3 -m coverage xml --rcfile=repository/verification/cover/coverage.ini -o .coverage-reports/swift-runner-coverage.xml
          '
      - name: Upload Swift coverage
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: |
            .coverage-reports/swift-coverage.xml
            .coverage-reports/swift-runner-coverage.xml
          if-no-files-found: error

  qml-and-python-tests:
    needs: swift-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Run Python tests
        if: ${{ !cancelled() }}
        run: |
          nix shell --impure --expr 'let pkgs = (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}; in import ./machine-configuration/development/testing/test-suite-environment.nix { inherit pkgs; }' --command bash -c '
            export REPO_DIR="$PWD"
            mkdir -p .coverage-reports
            export COVERAGE_PROCESS_START="$PWD/repository/verification/cover/coverage.ini"
            export PYTEST_ADDOPTS="--cov --cov-append --cov-config=repository/verification/cover/coverage.ini --cov-report=xml"
            source repository/verification/runner/discovery.sh
            source repository/verification/runner/pytest.sh
            unitExitCode=0
            _run_pytest_tier unit quick || unitExitCode=$?
            integrationExitCode=0
            _run_pytest_tier integration integration-scripts || integrationExitCode=$?
            exit $(( unitExitCode > integrationExitCode ? unitExitCode : integrationExitCode ))
          '

      - name: Retain native Python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-junit
          path: .quality-results/pytest-*.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Run QML unit tests
        if: ${{ !cancelled() }}
        run: |
          nix shell nixpkgs#qt6.qtdeclarative --command bash -c '
            export QT_DECLARATIVE_PATH=$(dirname $(dirname $(which qmltestrunner)))
            bash machine-configuration/desktop/desktop-environments/hyprland/__tests__/qml/run-qml-tests.sh
          '

      - name: Upload Python coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: .coverage-reports/python-coverage.xml
          if-no-files-found: error

      - name: Download Swift coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: swift-coverage
          path: .coverage-reports

      - name: Enforce local coverage of changed lines
        if: ${{ !cancelled() }}
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          coveragePackage=$(nix build --no-link --print-out-paths --impure --expr 'let pkgs = builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.nixpkgs.legacyPackages; in (import ./machine-configuration/development/testing/local-lint/local-lint-tools.nix { inherit pkgs; }).coverage')
          "$coveragePackage/bin/dotfiles-coverage-check" .coverage-reports/python-coverage.xml .coverage-reports/swift-runner-coverage.xml .coverage-reports/swift-coverage.xml --compare-branch "$COVERAGE_BASE"

      - name: Run QML lint
        if: ${{ !cancelled() }}
        run: |
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#quickshell --command bash -c '
            export REPO_DIR="$PWD"
            export QT_DECLARATIVE_PATH=$(dirname $(dirname $(which qmllint)))
            export QMLLINT_REQUIRED=1
            source repository/verification/runner/qml.sh
            _run_qmllint_checks
          '

      - name: Run Lua unit tests
        if: ${{ !cancelled() }}
        run: |
          nix shell nixpkgs#lua5_4 --command bash -c '
            export REPO_DIR="$PWD"
            source repository/verification/runner/discovery.sh
            source repository/verification/runner/lua.sh
            _run_lua_unit_tests
          '
