name: ci-speedup-probe

on:
  pull_request:

jobs:
  probe:
    name: determinate ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: flake-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          installer: determinate
          cache-variant: -determinate

      - name: Nix flake checks
        run: nix flake check --no-eval-cache --keep-going $ARR_STACK_STUB_OVERRIDE --print-build-logs --show-trace --max-jobs 8 --cores 2

      - name: Retain native package outputs for the store cache
        run: |
          nix build $ARR_STACK_STUB_OVERRIDE --out-link "$RUNNER_TEMP/native-cache-package" \
            .#nixosConfigurations.chise.config.home-manager.users.zanoni.codex.unwrappedPackage \
            .#checks.x86_64-linux.domain-local-model-tokenizer-long-input.tokenizerPackage
