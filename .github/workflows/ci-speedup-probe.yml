name: ci-speedup-probe

on:
  pull_request:

jobs:
  probe:
    name: warm-compare ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: flake-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          installer: determinate

      - name: Warm the store with a full check
        run: |
          rmdir private-configuration
          nix flake check --keep-going $ARR_STACK_STUB_OVERRIDE --max-jobs 8 --cores 2 2>&1 | tail -5

      - name: Upstream client
        run: |
          upstreamNix=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')/bin/nix
          "$upstreamNix" --version
          time "$upstreamNix" flake check --keep-going $ARR_STACK_STUB_OVERRIDE --max-jobs 8 --cores 2 2>&1 | tail -3

      - name: Determinate client
        run: |
          nix --version
          time nix flake check --keep-going $ARR_STACK_STUB_OVERRIDE --max-jobs 8 --cores 2 2>&1 | tail -3

      - name: Upstream client again
        run: |
          upstreamNix=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')/bin/nix
          time "$upstreamNix" flake check --keep-going $ARR_STACK_STUB_OVERRIDE --max-jobs 8 --cores 2 2>&1 | tail -3

      - name: Determinate client again
        run: time nix flake check --keep-going $ARR_STACK_STUB_OVERRIDE --max-jobs 8 --cores 2 2>&1 | tail -3
