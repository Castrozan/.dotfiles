name: ci-speedup-probe

on:
  pull_request:

jobs:
  probe:
    name: ${{ matrix.variant }} ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
        variant: [baseline, determinate, prefetch, determinate-prefetch]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: flake-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          installer: ${{ startsWith(matrix.variant, 'determinate') && 'determinate' || 'upstream' }}
          prefetch-inputs: ${{ endsWith(matrix.variant, 'prefetch') && 'true' || 'false' }}

      - name: Nix flake checks
        run: |
          nix --version
          nix config show | grep -E '^(eval-cores|lazy-trees|max-jobs|cores) ' || true
          nix flake check --keep-going $ARR_STACK_STUB_OVERRIDE --print-build-logs --show-trace --max-jobs 8 --cores 2

      - name: Prefetch log
        if: ${{ always() && endsWith(matrix.variant, 'prefetch') }}
        run: tail -5 "$RUNNER_TEMP/prefetch-inputs.log" || true
