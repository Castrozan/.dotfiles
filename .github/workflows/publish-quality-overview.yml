name: Publish quality overview

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  overview:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      REPORT_ARTIFACT_BASE_URL: https://lucaszanoni.com/engineering/dotfiles/reports/data/reports/
      PUBLISHING_SCRIPTS: agent-harness/measurement-and-reporting/quality-overview/publishing
    steps:
      - uses: actions/checkout@v4
      - name: Require the private publishing configuration
        env:
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
        run: |
          test -n "$INGEST_BASE_URL"
          test -n "$INGEST_PRODUCER_SECRET"
          test -n "$REPORT_ARTIFACT_BASE_URL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Bind the completed producing run and artifact attempt
        run: |
          mkdir -p .quality-results/downloads
          python3 "$PUBLISHING_SCRIPTS/workflow_context.py" "$GITHUB_EVENT_PATH" .quality-results/workflow-context.json
      - name: Download verified artifacts by exact identifier
        run: python3 "$PUBLISHING_SCRIPTS/download_artifacts.py" .quality-results/workflow-context.json .quality-results/downloads
      - uses: actions/checkout@v4
        with:
          repository: Castrozan/verdr
          ref: 39bfb94931f6903c9fa08a77984f9a492af80529
          path: .quality-results/verdr
      - name: Build the pinned portable report generator
        working-directory: .quality-results/verdr
        run: npm ci --ignore-scripts && npm run build
      - name: Verify publisher failure and preservation controls
        env:
          VERDR_EVALUATOR_ROOT: ${{ github.workspace }}/.quality-results/verdr
        run: node --test "$PUBLISHING_SCRIPTS"/__tests__/*.test.mjs
      - name: Build overview without turning missing inputs into passes
        id: overview
        run: |
          node "$PUBLISHING_SCRIPTS/build_snapshot.mjs" "$PWD/.quality-results/verdr" \
            .quality-results/workflow-context.json .quality-results/downloads .quality-results/overview
      - name: Retain overview and source metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotfiles-quality-overview
          path: |
            .quality-results/overview
            .quality-results/workflow-context.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish versioned overview artifacts
        id: overview_artifacts
        if: ${{ !cancelled() && steps.overview.outcome == 'success' }}
        env:
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
        run: |
          mkdir -p .quality-results/publications
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_report_artifacts.py \
            .quality-results/overview/payload.json .quality-results/overview/site \
            "reports/overview/$SOURCE_RUN_ID/$SOURCE_RUN_ATTEMPT/" > .quality-results/publications/overview.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .quality-results/source
          submodules: false
      - uses: ./.github/actions/nix-setup
        with:
          cache-key: publish-agent-evals
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the traditional test suite on the agent-evals page
        id: traditional-suite
        continue-on-error: true
        env:
          AGENT_EVALS_CONFIG: agent-harness/quality/evaluations/config.yaml
        run: |
          nix build --impure --out-link agent-evals --expr '(builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./. + "?shallow=1")).inputs.dependencies.inputs.agent-evals.packages).default'
          mkdir -p .quality-results/source/.quality-results
          cp -R .quality-results/downloads .quality-results/source/.quality-results/downloads
          cd .quality-results/source
          "$GITHUB_WORKSPACE/agent-evals/bin/agent-evals" testes
      - name: Assemble reports from the verified producing revision and coverage artifact
        id: reports
        env:
          REPORT_SITE: ${{ github.workspace }}/agent-harness/measurement-and-reporting/reports/site
        run: |
          python3 "$PUBLISHING_SCRIPTS/prepare_reports.py" .quality-results/workflow-context.json .quality-results/downloads "$REPORT_SITE"
          evaluation_results=.quality-results/source/agent-harness/quality/evaluations/resultado
          if [ -f "$evaluation_results/relatorio.html" ]; then
            mkdir -p "$REPORT_SITE/baseline"
            cp "$evaluation_results/relatorio.html" "$REPORT_SITE/baseline/index.html"
            cp "$evaluation_results/relatorio.json" "$REPORT_SITE/baseline/report.json"
            cp "$evaluation_results/badge.svg" "$REPORT_SITE/baseline/badge.svg"
            echo "evaluation_report=present" >> "$GITHUB_OUTPUT"
          fi
      - name: Check this snapshot still represents the current main run
        if: ${{ !cancelled() && steps.overview.outcome == 'success' && steps.overview_artifacts.outcome == 'success' }}
        id: promotion
        run: |
          promote=$(python3 "$PUBLISHING_SCRIPTS/promote_snapshot.py")
          echo "current=$promote" >> "$GITHUB_OUTPUT"
      - name: Publish current report artifacts
        id: current_artifacts
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.promotion.outputs.current == 'true' }}
        env:
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
        run: |
          mkdir -p .quality-results/publications
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_report_artifacts.py \
            .quality-results/overview/payload.json agent-harness/measurement-and-reporting/reports/site \
            reports/ > .quality-results/publications/current.json
      - name: Publish the current overview to the existing ingestion API
        if: ${{ !cancelled() && steps.promotion.outputs.current == 'true' }}
        env:
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
          INGEST_PRODUCER_LABEL: dotfiles-github-actions
        run: python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_quality_overview_snapshot.py
      - name: Publish the current coverage snapshot to the ingestion API
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.current_artifacts.outcome == 'success' && steps.promotion.outputs.current == 'true' }}
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          INGEST_BASE_URL: ${{ vars.INGEST_BASE_URL }}
          INGEST_PRODUCER_SECRET: ${{ secrets.INGEST_PRODUCER_SECRET }}
          INGEST_PRODUCER_LABEL: dotfiles-github-actions
        run: |
          export GITHUB_SHA="$SOURCE_REVISION"
          export GITHUB_RUN_ID="$SOURCE_RUN_ID"
          python3 agent-harness/measurement-and-reporting/snapshot-ingestion/publish_test_coverage_snapshot.py .quality-results/downloads/coverage-report/bats/coverage.json
      - name: Retain private artifact publication manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotfiles-private-artifact-publication
          path: .quality-results/publications/*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Require complete evidence after retaining the diagnostic report
        if: ${{ !cancelled() && steps.overview.outcome == 'success' }}
        run: node "$PUBLISHING_SCRIPTS/check_completeness.mjs" < .quality-results/overview/payload.json
