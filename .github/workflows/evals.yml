name: evals
on:
  push:
    branches: [main]
    paths:
      - "agent-harness/**"
      - "CLAUDE.md"
  pull_request:
    paths:
      - "agent-harness/**"
      - "CLAUDE.md"

jobs:
  baseline-regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: eval-contracts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the pinned agent-evals
        run: |
          nix build --impure --out-link agent-evals --expr '(builtins.getAttr builtins.currentSystem (builtins.getFlake ("git+file://" + toString ./.)).inputs.dependencies.inputs.agent-evals.packages).default'

      - name: Check the recorded baseline without model providers
        env:
          AGENT_EVALS_CONFIG: agent-harness/quality/evaluations/config.yaml
        shell: bash
        run: ./agent-evals/bin/agent-evals check --gravado | tee recorded-baseline-report.txt

      - name: Retain the verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals-verdict
          path: recorded-baseline-report.txt
