name: ci-speedup-probe-b

on:
  pull_request:

jobs:
  probe:
    name: ${{ matrix.variant }} ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [seed]
        variant: [input-roots]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup
        with:
          cache-key: flake-check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-variant: ${{ matrix.variant == 'input-roots' && '-input-roots' || '' }}

      - name: Nix flake checks
        run: nix flake check --keep-going $ARR_STACK_STUB_OVERRIDE --print-build-logs --show-trace --max-jobs 8 --cores 2

      - name: Retain native package outputs and fetched flake inputs for the store cache
        run: |
          nix build $ARR_STACK_STUB_OVERRIDE --out-link "$RUNNER_TEMP/native-cache-package" \
            .#nixosConfigurations.chise.config.home-manager.users.zanoni.codex.unwrappedPackage \
            .#checks.x86_64-linux.domain-local-model-tokenizer-long-input.tokenizerPackage
          if [ "${{ matrix.variant }}" = input-roots ]; then
            mkdir -p "$RUNNER_TEMP/flake-input-roots"
            nix flake archive --dry-run --json $ARR_STACK_STUB_OVERRIDE | jq -r '.. | .path? // empty' | while read -r inputPath; do
              if nix-store --check-validity "$inputPath" 2>/dev/null; then
                nix-store --realise --add-root "$RUNNER_TEMP/flake-input-roots/${inputPath#/nix/store/}" "$inputPath" > /dev/null
              fi
            done
            ls "$RUNNER_TEMP/flake-input-roots" | wc -l
          fi
