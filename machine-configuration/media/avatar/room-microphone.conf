context.properties = { log.level = 2 }
context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.* = support/libspa-support
}
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      capture.props = { node.name = "avatar-room-capture" node.passive = true }
      source.props = { node.name = "AvatarRoomMicrophone" node.description = "Avatar room microphone" }
      sink.props = { node.name = "avatar-room-reference" }
      playback.props = { node.name = "avatar-room-playback" }
    }
  }
]
