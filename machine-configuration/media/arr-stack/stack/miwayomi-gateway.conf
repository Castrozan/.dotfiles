map $http_x_forwarded_proto $miwayomi_external_scheme {
  default $scheme;
  ~^https(?:\s*,|$) https;
}

map $uri $miwayomi_static_cache_control {
  default "";
  "/" "no-cache, must-revalidate";
  ~*\.(?:html|js|css|json)$ "no-cache, must-revalidate";
}

server {
  listen 4568;
  server_name _;

  location / {
    proxy_pass http://miwayomi:4567;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $miwayomi_external_scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    add_header Cache-Control $miwayomi_static_cache_control always;
    proxy_read_timeout 300s;
    proxy_buffering off;
    sub_filter_types application/vnd.apple.mpegurl application/dash+xml;
    sub_filter "http://miwayomi:4567" "$miwayomi_external_scheme://$http_host";
    sub_filter_once off;
  }
}
