name: arr-stack

x-arr-common-environment: &arr-common-environment
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-stable-public-dns: &stable-public-dns
  - 1.1.1.1
  - 8.8.8.8

networks:
  arrnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: arr-qbittorrent
    restart: "no"
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:8080:8080"
    environment:
      <<: *arr-common-environment
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ${ARR_CONFIG_ROOT}/qbittorrent:/config
      - ${ARR_DATA_ROOT}:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls151@sha256:3950b5e48cf4ba9dab78fe14038dd7f062e66b7b4ab368b02c94a13f6a3dae9f
    container_name: arr-prowlarr
    restart: "no"
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:9696:9696"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/prowlarr:/config

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls316@sha256:fbb15bb4fb14d1ffe017f6be0e3fed8f1b300e4687e329767da0b61f36ba1eed
    container_name: arr-sonarr
    restart: "no"
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:8989:8989"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/sonarr:/config
      - ${ARR_DATA_ROOT}:/data

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1.10461-ls308@sha256:39da107b5a9371fdaa651bd188049b863716a815385eb3a30d41071b7e1aeb33
    container_name: arr-radarr
    restart: "no"
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:7878:7878"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/radarr:/config
      - ${ARR_DATA_ROOT}:/data

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.5.6-ls352@sha256:aaaa087af75a73b7ac765dcc5d748874cfafdb93c23ec9f64fbb481dea291b23
    container_name: arr-bazarr
    restart: "no"
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:6767:6767"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/bazarr:/config
      - ${ARR_DATA_ROOT}:/data

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls39@sha256:96d21c396f46f10578931c2941e3f2789f7087b5ab0e166afedf29e7385c6aa7
    container_name: arr-jellyfin
    restart: unless-stopped
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:8096:8096"
      - "127.0.0.1:8096:8096"
    environment:
      <<: *arr-common-environment
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ${ARR_CONFIG_ROOT}/jellyfin:/config
      - ${ARR_DATA_ROOT}/media:/media:ro

  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: arr-jellyseerr
    restart: unless-stopped
    networks:
      - arrnet
    dns: *stable-public-dns
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:5055:5055"
      - "127.0.0.1:5055:5055"
    environment:
      <<: *arr-common-environment
      LOG_LEVEL: "info"
    volumes:
      - ${ARR_CONFIG_ROOT}/jellyseerr:/app/config

  kavita:
    image: lscr.io/linuxserver/kavita:v0.9.0.2-ls119@sha256:08bc0679401c5370e32373a9a7fa43ed4aa800388e04dcb2015500c09ead8ddb
    container_name: arr-kavita
    restart: unless-stopped
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:5000:5000"
      - "127.0.0.1:5000:5000"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/kavita:/config
      - ${ARR_DATA_ROOT}/manga/mangas:/manga:ro

  miwayomi:
    build:
      context: ${MIWAYOMI_BUILD_CONTEXT:?set in ~/arr-stack/.env}
      dockerfile: miwayomi.Dockerfile
      args:
        MIWAYOMI_WEB_CACHE_VERSION: ${MIWAYOMI_WEB_CACHE_VERSION:?set in ~/arr-stack/.env}
    image: arr-miwayomi:0.2.9-watch-progress
    container_name: arr-miwayomi
    restart: unless-stopped
    hostname: miwayomi
    user: "${PUID}:${PGID}"
    networks:
      - arrnet
    dns: *stable-public-dns
    environment:
      <<: *arr-common-environment
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - ${ARR_CONFIG_ROOT}/miwayomi:/data
      - ${ARR_CONFIG_ROOT}/miwayomi-update-disabled:/data/update:ro
    depends_on:
      flaresolverr:
        condition: service_healthy

  miwayomi-gateway:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    container_name: arr-miwayomi-gateway
    restart: unless-stopped
    networks:
      - arrnet
    ports:
      - "${ARR_BIND_ADDR:?set in ~/arr-stack/.env}:4568:4568"
    environment:
      <<: *arr-common-environment
    volumes:
      - ${MIWAYOMI_GATEWAY_CONFIG_PATH:?set in ~/arr-stack/.env}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      miwayomi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4568/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  flaresolverr:
    image: ghcr.io/miwayomi/flaresolverr:0.2.9@sha256:41207a879aebc3e36101734377041a9d82e7375db274aebc0d15c87e51134189
    container_name: arr-flaresolverr
    restart: unless-stopped
    networks:
      - arrnet
    dns: *stable-public-dns
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      <<: *arr-common-environment
    volumes:
      - ${ARR_CONFIG_ROOT}/flaresolverr:/config
