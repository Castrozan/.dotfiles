sonar.organization=castrozan-oss
sonar.projectKey=Castrozan_.dotfiles
sonar.projectName=.dotfiles
sonar.sources=agent-harness,machine-configuration,repository,.github,README.md
sonar.tests=agent-harness,machine-configuration,repository
sonar.test.inclusions=**/__tests__/**,**/conftest.py,**/*.test.js,**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/__tests__/**,**/conftest.py,**/*.test.js,**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/vendor/**,**/dist/**,**/result/**
sonar.sourceEncoding=UTF-8
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*.md,**/*.mdx,**/*.nix,**/*.qml,**/*.lua,**/*.sh,**/*.bash,**/*.zsh,**/*.properties,**/*.conf,**/*.pem,**/*.config,.env,.aws/config
sonar.secrets.excluded.file.suffixes=.adoc,.dist,.html,.example,.sample,.template
sonar.secrets.disableTestFileDetection=true
sonar.python.version=3.12
sonar.typescript.tsconfigPaths=agent-harness/**/tsconfig.json,machine-configuration/**/tsconfig.json,repository/**/tsconfig.json
sonar.python.coverage.reportPaths=.sonar-reports/python-coverage.xml,.sonar-reports/swift-runner-coverage.xml
sonar.coverageReportPaths=.sonar-reports/swift-coverage.xml
sonar.coverage.exclusions=**/*.js,**/*.mjs,**/*.cjs,**/*.ts,**/*.tsx,**/*.jsx,**/*.sh,**/*.bash,**/*.zsh
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
