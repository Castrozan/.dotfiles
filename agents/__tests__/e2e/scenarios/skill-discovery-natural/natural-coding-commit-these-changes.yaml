name: skill_discovery_natural_coding_commit_these_changes
description: User asks for a commit with no hint about message or staging discipline. Agent should still route to coding.

setup:
  git_init: true
  files:
    - path: feature.py
      content: |
        def add_numbers(a, b):
            return a + b

prompt: |
  Commit these changes.

timeout: 180

assertions:
  autonomous_skill_invocation:
    - coding
  wrong_skill_not_invoked:
    - nix
    - research
