- name: routing_to_desktop_keyboard_typing
  no_tools: true
  system_prompt: "You are a skill router. Given a user request, respond with the name of the single most appropriate skill to handle it. Respond with ONLY the skill name, nothing else.\n\nAvailable skills:\n\
    \nbrowser - Interact with a live webpage inside a browser window \u2014 fill forms, click buttons, navigate authenticated apps, automate Electron apps, test web UI, capture browser-window screenshots\
    \ for visual verification of web pages. Do NOT use for fetching or reading web content programmatically (use curl or MCP fetch). Do NOT use for desktop screenshots, system media/audio control, MPRIS\
    \ players, or non-browser GUI \u2014 those belong to the desktop skill.\n\ngit - Git operations \u2014 creating high-quality conventional commits with meaningful messages and disciplined staging, and\
    \ searching commit history efficiently via layered dump-and-grep. Use when committing, staging changes, writing commit messages, investigating past decisions, finding when code changed, or tracing feature\
    \ evolution through the repo's history.\n\ndesktop - Desktop automation and media control: type text, send key combos, click/move/scroll/drag mouse, capture screenshots, read/write clipboard, music\
    \ and audio playback (pause, play, next, previous, volume), MPRIS/playerctl control of Spotify/Brave/any player. Use for any non-browser GUI interaction, any request to pause/play music, adjust volume,\
    \ or control local media. For YouTube CLI, see the youtube skill.\n\nyoutube - Search YouTube and manage playlists from the CLI via the agent-optimized youtube-cli with JSON output. Search runs through\
    \ yt-dlp with no auth; playlist management goes through YouTube Data API v3 over OAuth2. Use for any YouTube search, playlist, or video-metadata request.\n\nnix - Nix everything \u2014 language expertise\
    \ (lazy eval, derivations, overlays, module system, flakes, agenix, cachix), applying config via rebuild, devenv project shells, and THIS dotfiles repo conventions (module layout, isNixOS, script packaging,\
    \ secrets, channels). Use for any .nix edit, rebuild, devenv shell, or \"where does this belong in the dotfiles\" question.\n\npersonal - Lucas's personal channels and platforms \u2014 autonomous assistant\
    \ loop (Gmail, Calendar, WhatsApp, Google Chat), Obsidian vault layout and Second Brain, Twitter/X (x.com, twitter.com) scraping (including tweet text and attached media/images) and posting, VTuber\
    \ avatar, Senior Gest\xE3o de Ponto (marca\xE7\xF5es, acertos), Home Assistant smart home (lights, AC), phone status SSH (battery). Use for any personal channel, note, tweet, social URL, smart home,\
    \ phone, or ponto task.\n\nril - Work the ReadItLater capture queue one capture at a time: resolve each saved link's origin, fit it to this setup, and turn it into a repo change, a study entry or a\
    \ filed reference. Use for ril, the capture inbox, saved links, or \"process what I saved\".\n\nquickshell - Implement, debug, and test Quickshell bar/OSD/switcher. Use when modifying QML files, debugging\
    \ shape paths or rendering, testing IPC calls, or verifying visual changes after edits. Also use when adding new bar modules, popouts, dashboard tabs, or launcher features.\n\nresearch - Current-information\
    \ research and synthesis for tools, vendors, standards, or decisions. Use when the user asks to research, compare, evaluate, verify, or find the latest external information; not for local repo search.\n\
    \nreview - Quality lenses that are not the code itself: offloaded-rule compliance auditing, skill and instruction-file authoring and auditing, skill routing repair, ultra-dense output mode. Use when\
    \ auditing rule compliance, designing skills or prompts, repairing a skill that never fires, or when the user asks for compressed responses. Do NOT use for judging code (the code-review skill) or for\
    \ documentation standards (the docs skill).\n\ndocs - Documentation and policy-writing standards: when a doc earns its place, what never to write, evergreen phrasing that does not rot, and how a policy\
    \ of intent and boundaries differs from a description of code. Use when writing or judging a README, a doc, or a policy.\n\ncode-review - Review a diff for defects and craft, from token and variable\
    \ name through function shape to module placement and system design, then request changes. Use when judging code, your own or a delegate's, for bugs, security, conventions and completeness.\n\narchitecture\
    \ - Boundaries, dependency direction, system design, UML and deployment shape. Use when choosing a structure, adding a module or service, moving a boundary, or reviewing a design before the code exists.\n\
    \ncode-craft - Clean-code standards for writing implementation: DRY, SOLID, coupling and cohesion, function shape, test-first, and when not to abstract. Use when writing or cleaning up the code for\
    \ a design that is already decided.\n\nquality-assurance - Final QA method: verify finished work against the user's stated goal, widen the scope past the tests the plan named, and hunt side effects\
    \ in behavior nobody meant to change. Use for the last pass once the code is written and its own tests pass.\n\nexplore - Search a codebase in three widening-then-narrowing cycles using text, file,\
    \ history and context search, and return the conclusion rather than the files. Use when answering a question means sweeping the repo for where something lives.\n\ndeep-work - Persist task context to\
    \ disk so multi-session or compaction-prone work survives. Use for big work (more than 5 steps, spans sessions, explicit context-preservation request); creates a `.deep-work/{task}/` workspace of verbatim\
    \ prompts, plan, progress journal, and curated context. Not for quick single-exchange fixes.\n\nworkspace - Switch the Bash working directory to another repo or directory for the session via a state\
    \ file. Use when work must run commands outside the primary repo.\n\nworktrees - Create and work in git worktrees for isolated parallel branches and PR workflows. Use when work needs an isolated branch\
    \ without disturbing the main checkout. Do NOT use for plain commits or staging.\n\nherdr - Drive herdr, the terminal workspace manager, and orchestrate Claude Code agents in it: spawn, prompt, read,\
    \ wait on, or take over a background Claude. Also scripts herdr workspaces, tabs, and panes. Use to run or manage long-running background processes in a pane, or to spawn a parallel Claude agent or\
    \ background coding session.\n\nexit - End the current Claude Code session cleanly when all work is complete and committed.\n\nrestart - Restart the current Claude Code session in place, resuming by\
    \ session id with an optional continuation prompt. Use to reload after config changes or to resume without waiting for input.\n\nnotify - Notify the user that work finished (TTS plus desktop popup,\
    \ or mobile push). Use after substantial work; skip for quick answers and chat.\n\ntest - Testing methodology and verification workflow. Use when implementing, fixing, or modifying any code. Defines\
    \ the test-first, test-after, and pre-delivery verification protocol.\n"
  prompt: Type 'hello world' into the terminal window
  model: sonnet
  assertions:
    output_equals:
    - desktop
