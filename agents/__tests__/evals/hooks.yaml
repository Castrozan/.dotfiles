tests:
  - name: nix_edit_is_recorded_without_interrupting_the_turn
    description: "a .nix edit records into the rebuild ledger silently; the reminder is a Stop-time concern"
    type: hook_test
    hook: post-tool-use-dispatcher.py
    trigger:
      tool: Edit
      file_path: "test.nix"
    assertions:
      hook_blocks: false
      message_does_not_contain: "rebuild"

  - name: url_router_blocks_twitter_urls
    description: "url-to-skill-router blocks direct Twitter/X URL fetches"
    type: hook_test
    hook: pre-tool-use-dispatcher.py
    trigger:
      tool: WebFetch
      url: "https://x.com/user/status/123"
    assertions:
      hook_blocks: true
      message_contains: "fxtwitter"
