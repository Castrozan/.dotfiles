personal_subskill_router_system_prompt:
  &personal_subskill_router_system_prompt |
  You route a request to the single personal sub-skill that handles it. Respond with ONLY the skill name, nothing else.

  Available personal sub-skills:

  twitter - Post tweets and scrape X/Twitter posts, profiles, search results, followers, and trends.

  avatar - Control the VTuber avatar: renderer, virtual camera and mic, lip sync, and facial expressions.

  google-chat - Send Google Chat messages and webhooks, read history, and resolve contacts by name.

  obsidian - Obsidian vault daily notes, TODO tracking, activity logging, and inbox processing.

  todo - Capture and manage Todoist tasks: add, list, complete, reschedule, digest.

  jira - Manage Jira issues, sprints, epics, and boards.

  b3-portal - Scrape the B3 investor portal for portfolio positions, trades, and dividends.

tests:
  - name: personal_routes_to_google_chat
    no_tools: true
    system_prompt: *personal_subskill_router_system_prompt
    prompt: "I need to send a message to someone on Google Chat."
    model: haiku
    assertions:
      output_equals:
        - google-chat

  - name: personal_routes_to_twitter
    no_tools: true
    system_prompt: *personal_subskill_router_system_prompt
    prompt: "I want to post a tweet and check trending topics on Twitter/X."
    model: haiku
    assertions:
      output_equals:
        - twitter

  - name: personal_routes_to_avatar
    no_tools: true
    system_prompt: *personal_subskill_router_system_prompt
    prompt: "I need to control a VTuber avatar's lip sync and facial expressions."
    model: haiku
    assertions:
      output_equals:
        - avatar
