stages:
  - validate

agent-forge:
  stage: validate
  image: nixos/nix:2.28.4@sha256:85169a7ff4ac6928b70b15ced20c74770e07e8fbc7f97e92f64c1fca47ea9486
  tags:
    - saas-linux-small-amd64
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  script:
    - validation_status=0
    - >-
      nix shell nixpkgs#nixfmt --command nixfmt --check
      machine-configuration/development/version-control/glab-home-manager.nix
      machine-configuration/development/version-control/git-home-manager.nix
      machine-configuration/machines/chise/home.nix
      machine-configuration/machines/user-packages-lucas-zanoni-home-manager.nix
      machine-configuration/security/secrets/public-secret-sources.nix
      secrets/secrets.nix
      agent-harness/agent-instructions/interactive-skill-catalog/interactive-agent-skills.nix
      agent-harness/agent-instructions/skills/development/forge/install/default.nix
      agent-harness/agent-instructions/skills/development/ci-watcher/install/default.nix
      agent-harness/agent-instructions/skills/knowledge/ril/install/default.nix
      agent-harness/harnesses/clawde/agents/steward.nix
      agent-harness/harnesses/clawde/agents/steward/forge-tools.nix
      agent-harness/harnesses/clawde/agents/ril-watcher/default.nix
      || validation_status=1
    - >-
      nix shell nixpkgs#python312Packages.pytest --command pytest
      machine-configuration/development/version-control/__tests__/unit/test_write_glab_configuration.py
      agent-harness/agent-instructions/skills/development/forge/__tests__/unit/test_repository.py
      agent-harness/agent-instructions/skills/development/forge/__tests__/unit/test_native.py
      agent-harness/agent-instructions/skills/development/ci-watcher/__tests__/unit/test_ci_watcher.py
      agent-harness/agent-instructions/skills/development/ci-watcher/__tests__/unit/test_gitlab_watcher.py
      agent-harness/harnesses/clawde/agents/steward/__tests__/unit/test_forge_ci_status.py
      agent-harness/agent-instructions/skills/knowledge/ril/__tests__/unit/test_pull_request_pacing.py
      agent-harness/agent-instructions/skills/knowledge/ril/__tests__/unit/test_gitlab_proposals.py -q
      || validation_status=1
    - exit "$validation_status"
