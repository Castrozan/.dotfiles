stages:
  - validate

gitlab-credentials:
  stage: validate
  image: nixos/nix:2.28.4@sha256:85169a7ff4ac6928b70b15ced20c74770e07e8fbc7f97e92f64c1fca47ea9486
  tags:
    - saas-linux-small-amd64
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  script:
    - >-
      nix shell nixpkgs#nixfmt --command nixfmt --check
      machine-configuration/development/version-control/glab-home-manager.nix
      machine-configuration/development/version-control/git-home-manager.nix
      machine-configuration/machines/chise/home.nix
      machine-configuration/machines/user-packages-lucas-zanoni-home-manager.nix
      machine-configuration/security/secrets/public-secret-sources.nix
      secrets/secrets.nix
    - >-
      nix shell nixpkgs#python312Packages.pytest --command pytest
      machine-configuration/development/version-control/__tests__/unit/test_write_glab_configuration.py -q
