id: nix-declarative-platform-detection
valid:
  - "{ isNixOS, ... }: if isNixOS then {} else {}"
invalid:
  - "builtins.pathExists /etc/NIXOS"
---
id: python-dynamic-evaluation
valid:
  - "json.loads(content)"
invalid:
  - "eval(content)"
  - "exec(content)"
---
id: javascript-dynamic-evaluation
valid:
  - "JSON.parse(content)"
invalid:
  - "eval(content)"
---
id: typescript-dynamic-evaluation
valid:
  - "JSON.parse(content)"
invalid:
  - "eval(content)"
---
id: lua-dynamic-evaluation
valid:
  - "vim.json.decode(content)"
invalid:
  - "load(content)"
  - "loadstring(content)"
---
id: typescript-chained-type-assertions
valid:
  - "const user = parseUser(input);"
  - "const user = input as User;"
  - "const user = <User>input;"
  - "const user = input as unknown;"
  - "const options = { enabled: true } as const;"
  - "const options = ({ enabled: true } as const) as const;"
  - "const options = (([1] as const)) as const as const;"
  - "const options = <const><const>[1];"
  - "const options = (<const>[1]) as const;"
  - "const options = <const>([1] as const);"
  - "const user = parseUser(input as string) as User;"
  - "const container = ({ user: input as User }) as Container;"
  - "const loader = (() => input as User) as Loader;"
  - "const user = (enabled ? input as User : fallback) as User;"
  - "const users = [input as User] as User[];"
  - "const user = (input as User).profile as Profile;"
  - "const user = (input as User) satisfies User;"
  - "const options = { enabled: true } satisfies Options;"
invalid:
  - "const user = input as unknown as User;"
  - "const user = input as any as User;"
  - "const user = input as object as User;"
  - "const user = (input as unknown) as User;"
  - "const user = (((input as unknown))) as User;"
  - "const user = <User><unknown>input;"
  - "const user = <User>((<unknown>input));"
  - "const user = (<unknown>input) as User;"
  - "const user = <User>(input as unknown);"
  - "const user = input as unknown as object as User;"
  - "const options = ([1] as const) as number[];"
  - "const options = ([1] as unknown) as const;"
  - "const options = (([1] as unknown) as const) as const;"
  - "const options = <const><unknown>[1];"
  - "const options = <unknown><const>[1];"
  - "const user = (input as\n  unknown) as\n  User;"
---
id: tsx-chained-type-assertions
valid:
  - "const user = parseUser(input);"
  - "const user = input as User;"
  - "const options = { enabled: true } as const;"
  - "const options = ({ enabled: true } as const) as const;"
  - "const options = (([1] as const)) as const as const;"
  - "const user = parseUser(input as string) as User;"
  - "const container = ({ user: input as User }) as Container;"
  - "const card = <UserCard user={input as User} />;"
  - "const card = (<UserCard user={input as User} />) as Element;"
  - "const user = (input as User) satisfies User;"
invalid:
  - "const user = input as unknown as User;"
  - "const user = (input as any) as User;"
  - "const user = (((input as unknown))) as User;"
  - "const user = input as unknown as object as User;"
  - "const options = ([1] as const) as number[];"
  - "const options = (([1] as unknown) as const) as const;"
  - "const card = <UserCard user={input as unknown as User} />;"
  - "const card = (<UserCard /> as unknown) as Element;"
---
id: python-world-writable-file-mode
valid:
  - "os.fchmod(file_descriptor, 0o600)"
  - "os.lchmod(path, 0o644)"
  - "os.fchmod(file_descriptor, mode)"
invalid:
  - "os.fchmod(file_descriptor, 0o666)"
  - "os.lchmod(path, 0o777)"
  - "os.fchmod(file_descriptor, 0o662)"
---
id: python-subprocess-without-timeout
valid:
  - "subprocess.run(command, check=True, timeout=30)"
  - "subprocess.check_output(command, timeout=timeout_seconds)"
  - "subprocess.Popen(command)"
invalid:
  - "subprocess.run(command, check=True)"
  - "subprocess.check_output(command, text=True)"
  - "subprocess.call(command)"
  - "subprocess.check_call(command)"
---
id: python-unit-test-fixed-sleep
valid:
  - "await asyncio.sleep(0)"
  - "clock.advance(seconds=30)"
  - "finished.wait(timeout=5)"
invalid:
  - "time.sleep(0.05)"
  - "await asyncio.sleep(0.01)"
  - "sleep(1)"
  - "time.sleep(TIMESTAMP_ORDERING_PAUSE_SECONDS)"
---
id: python-unit-test-clock-deadline-poll
valid:
  - "while not finished.is_set():\n    finished.wait(0.1)"
  - "while attempts < 3:\n    attempts += 1"
  - "while fake_clock.monotonic() < deadline:\n    fake_clock.advance(1)"
invalid:
  - "while time.monotonic() < deadline:\n    pass"
  - "while time.time() < started + 5:\n    pass"
  - "while loop.time() < deadline:\n    pass"
  - "while monotonic() < deadline:\n    pass"
---
id: python-unit-test-elapsed-time-bound
valid:
  - "assert first_started < second_finished"
  - "assert elapsed_seconds >= 0"
  - "assert parse_elapsed_time_to_seconds('05:06') == 306"
  - "assert plan.duration <= MAXIMUM_DURATION"
  - "def test_parsed_span():\n    elapsed = parse_span('00:05')\n    assert elapsed < 10"
  - "def test_fake_clock():\n    elapsed = fake_clock.monotonic() - started\n    assert elapsed < 1"
invalid:
  - "def test_probe():\n    elapsed = time.monotonic() - started\n    assert elapsed < 1.5"
  - "def test_probe():\n    elapsed_seconds = time.perf_counter() - started_at\n    assert elapsed_seconds < 0.28, 'gatherers must overlap'"
  - "assert time.monotonic() - started < 1"
  - "assert loop.time() - started <= 2"
