id: nix-declarative-platform-detection
valid:
  - "{ isNixOS, ... }: if isNixOS then {} else {}"
invalid:
  - "builtins.pathExists /etc/NIXOS"
---
id: python-dynamic-evaluation
valid:
  - "json.loads(content)"
invalid:
  - "eval(content)"
  - "exec(content)"
---
id: javascript-dynamic-evaluation
valid:
  - "JSON.parse(content)"
invalid:
  - "eval(content)"
---
id: typescript-dynamic-evaluation
valid:
  - "JSON.parse(content)"
invalid:
  - "eval(content)"
---
id: lua-dynamic-evaluation
valid:
  - "vim.json.decode(content)"
invalid:
  - "load(content)"
  - "loadstring(content)"
---
id: typescript-chained-type-assertions
valid:
  - "const user = parseUser(input);"
  - "const user = input as User;"
  - "const user = <User>input;"
  - "const user = input as unknown;"
  - "const options = { enabled: true } as const;"
  - "const options = ({ enabled: true } as const) as const;"
  - "const options = (([1] as const)) as const as const;"
  - "const options = <const><const>[1];"
  - "const options = (<const>[1]) as const;"
  - "const options = <const>([1] as const);"
  - "const user = parseUser(input as string) as User;"
  - "const container = ({ user: input as User }) as Container;"
  - "const loader = (() => input as User) as Loader;"
  - "const user = (enabled ? input as User : fallback) as User;"
  - "const users = [input as User] as User[];"
  - "const user = (input as User).profile as Profile;"
  - "const user = (input as User) satisfies User;"
  - "const options = { enabled: true } satisfies Options;"
invalid:
  - "const user = input as unknown as User;"
  - "const user = input as any as User;"
  - "const user = input as object as User;"
  - "const user = (input as unknown) as User;"
  - "const user = (((input as unknown))) as User;"
  - "const user = <User><unknown>input;"
  - "const user = <User>((<unknown>input));"
  - "const user = (<unknown>input) as User;"
  - "const user = <User>(input as unknown);"
  - "const user = input as unknown as object as User;"
  - "const options = ([1] as const) as number[];"
  - "const options = ([1] as unknown) as const;"
  - "const options = (([1] as unknown) as const) as const;"
  - "const options = <const><unknown>[1];"
  - "const options = <unknown><const>[1];"
  - "const user = (input as\n  unknown) as\n  User;"
---
id: tsx-chained-type-assertions
valid:
  - "const user = parseUser(input);"
  - "const user = input as User;"
  - "const options = { enabled: true } as const;"
  - "const options = ({ enabled: true } as const) as const;"
  - "const options = (([1] as const)) as const as const;"
  - "const user = parseUser(input as string) as User;"
  - "const container = ({ user: input as User }) as Container;"
  - "const card = <UserCard user={input as User} />;"
  - "const card = (<UserCard user={input as User} />) as Element;"
  - "const user = (input as User) satisfies User;"
invalid:
  - "const user = input as unknown as User;"
  - "const user = (input as any) as User;"
  - "const user = (((input as unknown))) as User;"
  - "const user = input as unknown as object as User;"
  - "const options = ([1] as const) as number[];"
  - "const options = (([1] as unknown) as const) as const;"
  - "const card = <UserCard user={input as unknown as User} />;"
  - "const card = (<UserCard /> as unknown) as Element;"
