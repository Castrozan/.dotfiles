  non-const-assertion:
    all:
      - matches: assertion
      - not:
          pattern: $VALUE as const
rule:
  all:
    - matches: assertion
    - has:
        matches: assertion
        stopBy:
          not:
            kind: parenthesized_expression
    - not:
        inside:
          matches: assertion
          stopBy:
            not:
              kind: parenthesized_expression
    - any:
