id: nix-declarative-platform-detection
language: Nix
severity: error
message: Use the injected isNixOS argument for platform detection.
rule:
  pattern: builtins.pathExists /etc/NIXOS
---
id: python-dynamic-evaluation
language: Python
severity: error
message: Parse data with a format-specific parser instead of executing it.
rule:
  any:
    - pattern: eval($$$ARGUMENTS)
    - pattern: exec($$$ARGUMENTS)
---
id: javascript-dynamic-evaluation
language: JavaScript
severity: error
message: Parse data with a format-specific parser instead of executing it.
rule:
  pattern: eval($$$ARGUMENTS)
---
id: typescript-dynamic-evaluation
language: TypeScript
severity: error
message: Parse data with a format-specific parser instead of executing it.
rule:
  pattern: eval($$$ARGUMENTS)
---
id: lua-dynamic-evaluation
language: Lua
severity: error
message: Parse data with a format-specific parser instead of executing it.
rule:
  any:
    - pattern: load($$$ARGUMENTS)
    - pattern: loadstring($$$ARGUMENTS)
---
id: typescript-chained-type-assertions
language: TypeScript
severity: error
message: Validate the value or preserve its inferred type instead of chaining assertions.
metadata:
  source: https://github.com/dmmulroy/anti-slop/blob/13909c9e07590f5a85d93c62712259fe14a883f7/src/rules/no-chained-type-assertions.ts
utils:
  assertion:
    any:
      - kind: as_expression
      - kind: type_assertion
  non-const-assertion:
    all:
      - matches: assertion
      - not:
          any:
            - pattern: $VALUE as const
            - pattern: <const>$VALUE
rule:
  all:
    - matches: assertion
    - has:
        matches: assertion
        stopBy:
          not:
            kind: parenthesized_expression
    - not:
        inside:
          matches: assertion
          stopBy:
            not:
              kind: parenthesized_expression
    - any:
        - matches: non-const-assertion
        - has:
            matches: non-const-assertion
            stopBy:
              not:
                any:
                  - matches: assertion
                  - kind: parenthesized_expression
---
id: tsx-chained-type-assertions
language: Tsx
severity: error
message: Validate the value or preserve its inferred type instead of chaining assertions.
metadata:
  source: https://github.com/dmmulroy/anti-slop/blob/13909c9e07590f5a85d93c62712259fe14a883f7/src/rules/no-chained-type-assertions.ts
utils:
  assertion:
    kind: as_expression
  non-const-assertion:
    all:
      - matches: assertion
      - not:
          pattern: $VALUE as const
rule:
  all:
    - matches: assertion
    - has:
        matches: assertion
        stopBy:
          not:
            kind: parenthesized_expression
    - not:
        inside:
          matches: assertion
          stopBy:
            not:
              kind: parenthesized_expression
    - any:
        - matches: non-const-assertion
        - has:
            matches: non-const-assertion
            stopBy:
              not:
                any:
                  - matches: assertion
                  - kind: parenthesized_expression
---
id: python-world-writable-file-mode
language: Python
severity: error
message: Remove write permission for other users.
rule:
  pattern: os.$METHOD($TARGET, $MODE)
constraints:
  METHOD:
    regex: ^(fchmod|lchmod)$
  MODE:
    regex: ^0o[0-7]*[2367]$
---
id: python-subprocess-without-timeout
language: Python
severity: error
message: Pass a timeout so a hung child process cannot hang its caller.
rule:
  pattern: subprocess.$METHOD($$$ARGUMENTS)
  not:
    has:
      kind: argument_list
      has:
        kind: keyword_argument
        has:
          field: name
          regex: ^timeout$
constraints:
  METHOD:
    regex: ^(run|call|check_call|check_output)$
---
id: python-unit-test-fixed-sleep
language: Python
severity: error
message: Wait on the signal the code gives, or inject the clock and advance it; a fixed sleep guesses how long real work takes and fails under load. A test that waits on a real process belongs in integration/.
metadata:
  source: https://github.com/interfere-inc/landmines/blob/abe23a5898f9823eebf57d63a323a5af8883e69b/packages/landmines/src/rules/no-fixed-sleep.ts
files:
  - "**/__tests__/unit/**/*.py"
rule:
  any:
    - pattern: time.sleep($DURATION)
    - pattern: asyncio.sleep($DURATION)
    - pattern: sleep($DURATION)
constraints:
  DURATION:
    not:
      regex: ^0(\.0*)?$
---
id: python-unit-test-clock-deadline-poll
language: Python
severity: error
message: Wait on the event that announces the state, such as a threading.Event, a pipe or the operation's own completion, instead of looping until a clock deadline; a longer deadline only hides the race. A test that waits on a real process belongs in integration/.
metadata:
  source: https://github.com/interfere-inc/landmines/blob/abe23a5898f9823eebf57d63a323a5af8883e69b/packages/landmines/src/rules/no-unsignaled-poll.ts
files:
  - "**/__tests__/unit/**/*.py"
rule:
  kind: while_statement
  has:
    field: condition
    has:
      kind: call
      regex: ^((time\.)?(monotonic|perf_counter)(_ns)?|time\.time(_ns)?|\S*loop(\(\))?\.time)\(\)$
      stopBy: end
---
id: python-unit-test-elapsed-time-bound
language: Python
severity: error
message: An upper bound on elapsed wall-clock time measures how busy the machine was, not the behavior. Assert the ordering that proves it, or prove concurrency with a threading.Barrier that only opens when the calls overlap.
metadata:
  source: https://github.com/interfere-inc/landmines/blob/abe23a5898f9823eebf57d63a323a5af8883e69b/packages/landmines/src/rules/no-elapsed-time-bound.ts
files:
  - "**/__tests__/unit/**/*.py"
utils:
  clock-reading:
    kind: call
    regex: ^((time\.)?(monotonic|perf_counter)(_ns)?|time\.time(_ns)?|\S*loop(\(\))?\.time)\(\)$
  elapsed-since-clock-reading:
    kind: binary_operator
    has:
      field: left
      matches: clock-reading
rule:
  kind: assert_statement
  has:
    kind: comparison_operator
    any:
      - pattern: $ELAPSED < $BOUND
      - pattern: $ELAPSED <= $BOUND
  any:
    - has:
        kind: comparison_operator
        has:
          nthChild: 1
          matches: elapsed-since-clock-reading
    - inside:
        kind: function_definition
        stopBy: end
        has:
          kind: assignment
          stopBy: end
          all:
            - has:
                field: left
                pattern: $ELAPSED
            - has:
                field: right
                matches: elapsed-since-clock-reading
