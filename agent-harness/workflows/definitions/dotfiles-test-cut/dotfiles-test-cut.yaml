name: dotfiles-test-cut
description: >-
  Cut the Python unit tests of one dotfiles subtree that catch nothing of their own. A script mutates the sources,
  runs for each mutant the tests that execute the mutated function, and records which fail. A test that runs mutated
  code and fails for no mutant is a candidate, and so is one whose every catch a single test in the same file repeats;
  a test that reaches no mutated code is not judged. One medium-tier judge reads the candidates against the rule for
  what earns a test, a script deletes the judged ones and lowers the test budget, and a second run drops the cut unless
  every mutant caught before is still caught. Works in a scratch worktree of the committed revision and returns the cut
  as a patch for the caller to apply. Spends one model call.
inputs:
  root: { required: true }
  subtree: { required: true }
returns: verify
mutates_checkout: false
worktree:
  enabled: false
nodes:
  - id: scratch
    mutates_checkout: false
    bash: |
      common=$(git -C "$INPUTS_ROOT" rev-parse --path-format=absolute --git-common-dir)
      scratch="${common%/.git}/.worktrees/dotfiles-test-cut"
      git -C "$INPUTS_ROOT" worktree remove --force "$scratch" >/dev/null 2>&1 || true
      git -C "$INPUTS_ROOT" worktree add --quiet --detach "$scratch" HEAD >&2
      @jq@ --null-input --arg root "$scratch" '{root: $root}'
    output_format:
      type: object
      properties:
        root: { type: string }
      required: [root]
  - id: measure
    depends_on: [scratch]
    mutates_checkout: false
    bash: |
      SCRATCH=$scratch.output.root
      python3 @workflowDirectory@/scripts/kill_matrix.py --root "$SCRATCH" --subtree "$INPUTS_SUBTREE" \
        --output "$ARTIFACTS_DIR/test-cut/matrix.json"
    output_format:
      type: object
      properties:
        matrix_path: { type: string }
        error: { type: string }
      required: [matrix_path, error]
  - id: candidates
    depends_on: [measure]
    when: "$measure.output.error == ''"
    mutates_checkout: false
    bash: |
      SCRATCH=$scratch.output.root
      @python@ @workflowDirectory@/scripts/cut_selection.py --root "$SCRATCH" \
        --matrix "$ARTIFACTS_DIR/test-cut/matrix.json" --output "$ARTIFACTS_DIR/test-cut/candidates.json"
    output_format:
      type: object
      properties:
        candidates_path: { type: string }
        candidates: { type: integer }
        candidates_left_for_another_run: { type: integer }
        tests: { type: integer }
        unreached: { type: integer }
        mutants: { type: integer }
        mutants_killed: { type: integer }
      required:
        - candidates_path
        - candidates
        - candidates_left_for_another_run
        - tests
        - unreached
        - mutants
        - mutants_killed
  - id: judge_data
    depends_on: [candidates]
    mutates_checkout: false
    bash: |
      SCRATCH=$scratch.output.root
      CANDIDATES_PATH=$candidates.output.candidates_path
      export SCRATCH CANDIDATES_PATH
      @instructionData@ --text SCRATCH CANDIDATES_PATH
    output_format:
      type: object
      properties:
        scratch: { type: string }
        candidates_path: { type: string }
      required: [scratch, candidates_path]
  - id: judge
    command: judge-test-candidates
    depends_on: [judge_data]
    with:
      root: $judge_data.output.scratch
      candidates_path: $judge_data.output.candidates_path
    context: fresh
    model: medium
    effort: medium
    mutates_checkout: false
    output_format:
      type: object
      properties:
        cuts:
          type: array
          maxItems: 80
          items:
            type: object
            properties:
              test: { type: string }
              condition: { type: integer, minimum: 1, maximum: 7 }
              reason: { type: string }
            required: [test, condition, reason]
      required: [cuts]
  - id: apply
    depends_on: [judge]
    mutates_checkout: false
    bash: |
      SCRATCH=$scratch.output.root
      judged=$judge.output
      printf '%s' "$judged" | @python@ @workflowDirectory@/scripts/apply_cut.py --root "$SCRATCH" \
        --candidates "$ARTIFACTS_DIR/test-cut/candidates.json" --output "$ARTIFACTS_DIR/test-cut/applied.json"
    output_format:
      type: object
      properties:
        removed: { type: integer }
        refused: { type: array, items: { type: string } }
      required: [removed, refused]
  - id: verify
    depends_on: [apply]
    mutates_checkout: false
    bash: |
      SCRATCH=$scratch.output.root
      python3 @workflowDirectory@/scripts/verify_cut.py --root "$SCRATCH" \
        --matrix "$ARTIFACTS_DIR/test-cut/matrix.json" --applied "$ARTIFACTS_DIR/test-cut/applied.json" \
        --patch "$ARTIFACTS_DIR/test-cut/cut.patch"
      git -C "$INPUTS_ROOT" worktree remove --force "$SCRATCH" >&2
    output_format:
      type: object
      properties:
        kept: { type: boolean }
        patch_path: { type: string }
        detail: { type: string }
        tests_before: { type: integer }
        tests_cut: { type: integer }
      required: [kept, patch_path, detail, tests_before, tests_cut]
