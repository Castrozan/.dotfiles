[package]
name = "claude-usage-collector"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gethostname = "1"
percent-encoding = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
url = "2"
walkdir = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
