categoria: skills/browser/browser
casos:
  - nome: browser_keeps_explicit_chrome_devtools_choice_during_recovery
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/workstation/browser/SKILL.md
    pergunta:
      I explicitly asked you to use Chrome DevTools through the browser harness. list_pages reports no attached tabs
      and the existing headed DevTools connection looks stale. State your next action in one sentence.
    assercoes:
      juiz:
        - Keeps the explicit Chrome DevTools choice and takes the next appropriate recovery action by launching or reconnecting
          Chrome Global or retrying chrome-devtools list_pages, instead of switching to or probing OpenCLI.
      nao_contem:
        - opencli daemon
        - opencli profile
        - opencli-run --
  - nome: browser_uses_chrome_devtools_for_public_scraping_when_available
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/workstation/browser/SKILL.md
    pergunta:
      I need an interactive scrape of a public site. Chrome DevTools is connected and list_pages works. Which browser
      path do you use? Answer in one sentence.
    assercoes:
      juiz:
        - Chooses Chrome DevTools because it is available, and does not choose OpenCLI merely because the site is public or the
          task is scraping.
  - nome: browser_uses_pinchtab_only_after_chrome_devtools_recovery_fails
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/workstation/browser/SKILL.md
    pergunta:
      I did not require a particular browser, and an isolated profile can satisfy this task. Chrome DevTools returned
      no pages, so I launched Chrome Global, enabled remote debugging, approved the consent prompt, and retried list_pages.
      It still cannot connect. Is OpenCLI eligible now? Answer in one sentence.
    assercoes:
      juiz:
        - Says OpenCLI is eligible only now as the last resort because every Chrome DevTools recovery step failed, Chrome remains
          unavailable, the user did not require it, and the isolated profile can satisfy the task.
  - nome: browser_reports_blocked_when_autonomous_agent_requires_chrome_devtools
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/workstation/browser/SKILL.md
    pergunta:
      You are an autonomous clawde agent, and I explicitly required Chrome DevTools for this browser task. The shared
      Chrome target reports that autonomous agents are mechanically denied. What do you do? Answer in one sentence.
    assercoes:
      juiz:
        - Reports that the explicit Chrome DevTools requirement is blocked in this autonomous session and does not silently substitute,
          invoke, inspect, restart, or configure OpenCLI.
      nao_contem:
        - opencli browser open
        - opencli daemon
        - opencli profile
        - opencli-run --
