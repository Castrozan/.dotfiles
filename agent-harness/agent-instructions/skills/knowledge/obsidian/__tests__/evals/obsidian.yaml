categoria: skills/obsidian/obsidian
casos:
  - nome: obsidian_capture_inbox_belongs_to_ril
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/obsidian/SKILL.md
    pergunta:
      I want to process the ReadItLater inbox by adding summaries, ratings, and tags directly to saved captures. Should
      I annotate them in place, and which skill and CLI should handle this inbox?
    assercoes:
      juiz:
        - Hands the inbox to the ril skill and its ril CLI, and refuses to summarize, rate or tag a capture in place because an
          annotated capture reads as worked while nothing was learned or adopted.
  - nome: obsidian_names_the_two_vault_zones
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/obsidian/SKILL.md
    pergunta: Where is the vault and what lives in it? Respond in one sentence.
    assercoes:
      contem:
        - OBSIDIAN_HOME
      juiz:
        - "Names the two zones: the ReadItLater capture inbox and the Second Brain."
  - nome: obsidian_sync_contention_is_not_a_fault
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/obsidian/SKILL.md
    pergunta: The sync log complains that another sync instance is already running. Is the vault broken?
    assercoes:
      juiz:
        - Says no, concurrent runs of the scheduled headless sync contend and that message is normal rather than a fault.
  - nome: obsidian_second_brain_contract_is_read_not_recalled
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/obsidian/SKILL.md
    pergunta: I am about to write a new Second Brain entry. What do I do first?
    assercoes:
      juiz:
        - Reads the authoritative CONTRIBUTING contract inside the vault first, rather than recalling the structure, because it
          evolves.
