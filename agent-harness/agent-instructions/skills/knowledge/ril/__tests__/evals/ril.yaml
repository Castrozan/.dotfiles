tests:
  - name: ril_marks_done_only_through_the_cli
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "I finished working a capture. Should I hand-edit the done marker, or is there a command that owns this?"
    model: haiku
    assertions:
      llm_judge:
        - "Says not to hand-edit the marker and names ril record as the command that owns marking the capture done."

  - name: ril_claim_collision_stops_the_run
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "ril claim printed 'held: capture.md' and exited non-zero. What now? Respond in one sentence."
    model: haiku
    assertions:
      llm_judge:
        - "Says another run already holds that capture, so stop and take the next one instead of forcing a takeover."

  - name: ril_completed_capture_is_not_a_claim_collision
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "ril claim printed 'already-done: capture.md' and exited non-zero. Is another run holding it? What should I do?"
    model: haiku
    no_tools: true
    assertions:
      llm_judge:
        - "Distinguishes an already completed capture from one held by another run, skips it without changing its completion record, and does not force a claim or repeat the work."

  - name: ril_never_annotates_a_capture
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "Should I summarize each saved item, tag it and rate its relevance in place?"
    model: haiku
    assertions:
      llm_judge:
        - "Refuses, saying a capture must end as a change to the repo, a deliberate thing to learn, or a filed reference, and that a pass leaving the machines and the brain unchanged has failed."

  - name: ril_resolves_the_capture_origin
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "In an interactive session, the capture's first link is an Instagram reel that serves an empty page to curl. Which source-resolution route should the agent use?"
    model: haiku
    assertions:
      llm_judge:
        - "Chooses chrome-devtools against the user's live browser rather than the browser skill, WebFetch, or topic search because curl cannot render the reel."

  - name: ril_verdict_belongs_to_the_user
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    no_tools: true
    prompt: "You, the agent, think this capture is obviously worth adopting. May you choose adopt and apply it without showing me a proposal? What must the user see and decide first?"
    model: haiku
    assertions:
      llm_judge:
        - "Refuses to self-approve, saying the user picks the verdict at the gate after being shown what it is, what it changes here, and the cost."

  - name: ril_proves_an_adopt_before_proposing_it
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    prompt: "The user approved an adopt. Outline how it gets applied."
    model: haiku
    assertions:
      llm_judge:
        - "Uses an isolated worktree rather than the main checkout, commits before building, names the worktree path in the flake reference instead of running rebuild, exercises the change, and opens a pull request that it merges only after approval."

  - name: ril_briefing_connects_original_source_and_personal_value
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      Research is finished on a capture from https://example.com/output-search. It describes indexing large tool outputs
      for later search. Our approved harness already caps output size, but retrieval quality and actual token savings
      here are unmeasured. Give me the briefing: what is it, what did you find, and how could it help us?
    assertions:
      llm_judge:
        - "Includes the original web link, explains retrieval versus output caps, connects it to a concrete user benefit, and recommends an action with the measurement gap rather than claiming savings."

  - name: ril_installed_code_is_not_user_approved_setup
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      During this RIL review you found an installed experimental task registry. I never asked for or approved it.
      Does its presence establish that it is our baseline, and should we build a trial around extending it?
    assertions:
      llm_judge:
        - "Distinguishes installed code from user-approved setup and refuses to treat the unrequested registry as an accepted foundation or a reason to extend it."

  - name: ril_exploratory_replacement_is_not_adoption_approval
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      If we adopt the saved browser tool, it would replace our fallback rather than our primary inspector.
      That is a provocation: can it do that, and is it useful in that scope? You know the feature list but have not
      tested its cleanup or idle resource usage. Sell me on the case without doing the installation.
    assertions:
      llm_judge:
        - "Explains a concrete benefit in the fallback replacement scope, preserves the primary inspector, identifies the runtime evidence gap, and treats the question as exploration rather than permission to install."

  - name: ril_approved_trial_uses_real_work_and_matching_metrics
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      I approved a proper, removable integration on my actual machine to test the capture's claimed token savings.
      A fake-log demo returned fewer bytes without any model calls. Does that prove the benefit, and what evidence
      should the real trial produce? Explain the plan; do not claim to have run it.
    assertions:
      llm_judge:
        - "Rejects byte reduction as proof of token savings, uses the approved real route with a removal path, and compares equivalent work on actual token or cost evidence while preserving output quality."

  - name: ril_no_useful_delta_does_not_require_another_trial
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      This capture describes a writing procedure already covered by our approved skill. Research found no missing
      capability or measured improvement. I do not want a project just to justify keeping the note. What do you recommend?
    assertions:
      llm_judge:
        - "Recommends reference or drop with a concrete reason, does not manufacture a pilot or framework, and leaves the final recording decision with the user."

  - name: ril_routes_a_useful_capture_to_its_existing_owner
    skill_path: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/knowledge/ril/references/interactive-review.md
    model: haiku
    no_tools: true
    prompt: >-
      This saved science-explainer video is useful as a format idea for our existing Shorts worker. Research verified
      that the worker already has an ideas inbox. What should we do with the capture? I have not yet approved an inbox
      write or a message to the worker.
    assertions:
      llm_judge:
        - "Recommends the existing worker and verified inbox with the source and useful takeaway, does not invent another pipeline, and does not claim or perform an unapproved write or message."
