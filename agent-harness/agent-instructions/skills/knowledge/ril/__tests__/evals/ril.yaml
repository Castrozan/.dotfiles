categoria: skills/ril/ril
casos:
  - nome: ril_marks_done_only_through_the_cli
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta: I finished working a capture. Should I hand-edit the done marker, or is there a command that owns this?
    assercoes:
      juiz:
        - Says not to hand-edit the marker and names ril record as the command that owns marking the capture done.
  - nome: ril_claim_collision_stops_the_run
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta: "ril claim printed 'held: capture.md' and exited non-zero. What now? Respond in one sentence."
    assercoes:
      juiz:
        - Says another run already holds that capture, so stop and take the next one instead of forcing a takeover.
  - nome: ril_completed_capture_is_not_a_claim_collision
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta:
      "ril claim printed 'already-done: capture.md' and exited non-zero. Is another run holding it? What should I
      do?"
    assercoes:
      juiz:
        - Distinguishes an already completed capture from one held by another run, skips it without changing its completion record,
          and does not force a claim or repeat the work.
  - nome: ril_never_annotates_a_capture
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta: Should I summarize each saved item, tag it and rate its relevance in place?
    assercoes:
      juiz:
        - Refuses, saying a capture must end as a change to the repo, a deliberate thing to learn, or a filed reference, and that
          a pass leaving the machines and the brain unchanged has failed.
  - nome: ril_resolves_the_capture_origin
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta:
      In an interactive session, the capture's first link is an Instagram reel that serves an empty page to curl. Which
      source-resolution route should the agent use?
    assercoes:
      juiz:
        - Chooses chrome-devtools against the user's live browser rather than the browser skill, WebFetch, or topic search because
          curl cannot render the reel.
  - nome: ril_verdict_belongs_to_the_user
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta:
      You, the agent, think this capture is obviously worth adopting. May you choose adopt and apply it without showing
      me a proposal? What must the user see and decide first?
    assercoes:
      juiz:
        - Refuses to self-approve, saying the user picks the verdict at the gate after being shown what it is, what it changes
          here, and the cost.
  - nome: ril_proves_an_adopt_before_proposing_it
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/knowledge/ril/SKILL.md
    pergunta: The user approved an adopt. Outline how it gets applied.
    assercoes:
      juiz:
        - Uses an isolated worktree rather than the main checkout, commits before building, names the worktree path in the flake
          reference instead of running rebuild, exercises the change, and opens a pull request that it merges only after approval.
