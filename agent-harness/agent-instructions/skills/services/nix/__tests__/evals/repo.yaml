categoria: skills/nix/repo
casos:
  - nome: dotfiles_directory_structure
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/services/nix/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/services/nix/references/repo.md
    pergunta: Where should I put a new reusable home-manager capability module in this dotfiles repo?
    assercoes:
      juiz:
        - Places the module under the domain capability that owns it in machine-configuration/<domain>/<capability>, using a -home-manager
          file-name suffix for the deployment mechanism instead of adding configuration to a machine entry point.
  - nome: dotfiles_isnixos_detection
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/services/nix/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/services/nix/references/repo.md
    pergunta: How do I conditionally enable something only on NixOS in this repo?
    assercoes:
      juiz:
        - Says to consume the injected isNixOS argument in the module's function arguments and guard the option with lib.mkIf,
          rather than probing the filesystem for a NixOS marker.
  - nome: nix_explains_lazy_evaluation_and_fixed_points
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/services/nix/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/services/nix/references/repo.md
      - agent-harness/agent-instructions/skills/services/nix/references/expert.md
    pergunta: I need help understanding Nix lazy evaluation and fixed-points. Can you explain?
    assercoes:
      juiz:
        - Explains that lazy evaluation defers computing a value until it is demanded, and that a fixed-point is a self-referential
          definition that feeds its own result back into itself.
