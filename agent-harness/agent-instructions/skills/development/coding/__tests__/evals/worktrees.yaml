categoria: skills/coding/worktrees
casos:
  - nome: worktrees_never_checkout_main
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/worktrees.md
    pergunta: I need to switch to a feature branch. Should I run git checkout in the main repo?
    assercoes:
      juiz:
        - The response answers that git checkout (or git switch) should not be run in the main repo, and directs the feature-branch
          work into a git worktree instead.
      nao_contem:
        - yes, run git checkout
  - nome: worktrees_pr_from_main_directory
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/worktrees.md
    pergunta: I finished my feature in a worktree. Where should I run the PR command?
    assercoes:
      juiz:
        - The response states that the PR command should be run from the main repo directory rather than from inside the worktree.
