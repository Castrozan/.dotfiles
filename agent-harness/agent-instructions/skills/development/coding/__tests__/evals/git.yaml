categoria: skills/coding/git
casos:
  - nome: commit_uses_specific_staging
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: Should I use git add -A to stage all my changes before committing?
    assercoes:
      juiz:
        - The response advises against `git add -A` and `git add .`, instead directing the user to stage specific files by name/path
          so unrelated parallel work is not staged.
  - nome: commit_reads_diff_first
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: What information do you need before writing a commit message?
    assercoes:
      juiz:
        - The response states that before writing the message you must inspect the actual changes, above all the git diff (staged
          and unstaged) and ideally git status and the recent git log for existing style, rather than generating the message from
          filenames alone.
  - nome: commit_matches_repository_convention
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: How should I choose the format for a commit message in an unfamiliar repository?
    assercoes:
      juiz:
        - "The response says to inspect and follow the repository's existing convention; when that convention is Conventional
          Commits, it uses `type(scope): subject` in imperative mood with a lowercase subject."
  - nome: git_history_never_uses_repeated_grep
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
      - agent-harness/agent-instructions/skills/development/coding/references/history.md
    pergunta: I need to search git history for all commits related to authentication. How should I do it?
    assercoes:
      juiz:
        - The response recommends the `git-history` command, which dumps the log once to /tmp so any grep against the dump is
          instant and reusable, instead of repeated `git log --grep` or `git log -G` scans.
  - nome: git_history_file_paths_are_high_signal
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
      - agent-harness/agent-instructions/skills/development/coding/references/history.md
    pergunta: What's the advantage of searching file paths in layer 1 over commit messages?
    assercoes:
      juiz:
        - The response explains that file paths are higher-signal than commit messages because a directory/path reveals what a
          commit actually touched even when the terse or misleading commit message omits the keyword, catching work that searching
          messages alone would miss.
  - nome: git_history_knows_when_not_to_use
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: I just want to see the last commit. Should I use this skill?
    assercoes:
      juiz:
        - The response advises NOT using the git-history skill for a simple last-commit lookup, pointing instead to a direct command
          such as `git log -1 HEAD` because a single targeted query does not benefit from the dump/cache pattern.
  - nome: git_history_cache_invalidation
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: How do I know if the cached git history file is still up to date?
    assercoes:
      juiz:
        - The response explains how to tell whether the cache is current, by running `git-history info` for cache status and/or
          noting that it auto-invalidates when HEAD changes or the file is older than one hour (refreshable with `--force`).
