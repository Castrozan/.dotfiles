name: Verify Wellput
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -S tests/verify_plugin.py .
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_hooks.py tests/test_exported_instructions.py tests/test_human_facing_reply_rules.py tests/test_reply_format_configuration.py tests/test_reply_markdown_structure.py tests/test_reply_quotation_performance.py
