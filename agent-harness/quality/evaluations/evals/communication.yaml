tests:
  - name: representation_ownership_uses_tree
    description: "Ownership and nesting are shown as a compact tree"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: |
      Explain this module layout so I can quickly see who owns request parsing, session state, and transport:
      src/commands/parse.py, src/sessions/store.py, src/transport/client.py.
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Uses a compact tree as the main representation because the reader needs to inspect file ownership and nesting, with each file or directory labeled by its responsibility."

  - name: representation_ordering_and_failure_uses_sequence
    description: "Runtime ordering and failure are shown as a sequence"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: |
      Explain the request path from UI to API to database, including that authentication can reject the request before
      the database call and that the UI receives the error.
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Uses a compact sequence or flow as the main representation because ordering and the authentication failure path are the relationships the reader must inspect."

  - name: representation_choices_use_table
    description: "Exact option comparisons are shown as a table"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: |
      Compare SQLite, PostgreSQL, and DynamoDB for local setup, concurrent writes, operational burden, and horizontal
      scaling so I can choose one.
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Uses a compact comparison table as the main representation, with the options as one dimension and the requested decision criteria as the other."

  - name: representation_behavior_uses_state_model
    description: "Event-driven behavior is shown as a state model"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: |
      Explain a job that moves from queued to running, may retry after a transient failure, and ends in succeeded or
      failed. A completed job cannot return to running.
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Uses a compact state model as the main representation, showing events or transitions and making the invalid completed-to-running transition clear."

  - name: representation_change_uses_focused_diff
    description: "A change against an existing shape is shown as a focused diff"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: |
      Show how the current src/transport.py file changes into src/transport/client.py and src/transport/stream.py while
      the rest of src stays unchanged.
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Uses a focused diff as the main representation because the reader needs to inspect a change against an existing file layout, and omits unrelated files."

  - name: representation_single_answer_stays_prose
    description: "A simple answer does not receive decorative structure"
    skill_path: agent-harness/agent-instructions/core-rules/communication/interactive-preferences.md
    prompt: "The service port is 8080. Which port should I connect to?"
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Answers 8080 directly in one short prose sentence and does not add a table, tree, diagram, diff, headings, or a list."
