tests:
  - name: context_budget_loads_only_material_information
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "The context window still has room. Should I load several unrelated logs now in case they become useful later?"
    model: haiku
    assertions:
      llm_judge:
        - "Says not to load unrelated logs speculatively because context is a finite attention budget and information should be loaded only when it can materially change the current reasoning or result."

  - name: context_budget_discards_stale_findings
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "Earlier findings no longer affect the task after the plan changed. Should I keep carrying them in the working context? Begin your answer with YES or NO."
    model: haiku
    assertions:
      llm_judge:
        - "Answers no and says findings that no longer matter should be discarded from the working context so they do not consume attention."

  - name: context_budget_uses_bounded_summaries
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "Why route large file reads and parallel subagent dumps through subagents that return summaries instead of keeping the raw output in the main session?"
    model: haiku
    assertions:
      llm_judge:
        - "Explains that raw dumps consume the finite attention budget and that bounded summaries retain the findings that can materially change the current reasoning or result."

  - name: context_budget_persists_resume_state
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "A multi-step task may outlive the current context. What state should be written down before continuing?"
    model: haiku
    assertions:
      llm_judge:
        - "Says to persist enough high-signal task state to resume without reconstructing it from memory and to place durable knowledge under the narrowest domain that owns it."
