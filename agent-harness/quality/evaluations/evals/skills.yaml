tests:
  - name: commit_skill_matches_repository_conventions
    skill_path: agent-harness/agent-instructions/skills/coding/SKILL.md
    extra_skill_paths:
      - agent-harness/agent-instructions/skills/coding/references/git.md
    prompt: "What are the key rules you follow when creating a commit in an unfamiliar repository?"
    model: haiku
    assertions:
      llm_judge:
        - "Says to inspect and match the repository's commit convention, describes `type(scope): subject` with an imperative lowercase subject when Conventional Commits are used, and stages only specific task-owned files."
