# Agent Evaluation Settings
# Shared settings for all test categories

settings:
  canonical_subject_harness: codex
  canonical_judge_harness: codex
  subject_models:
    claude: haiku
    codex: gpt-5.6-luna
  subject_reasoning_efforts:
    codex: low
  judge_models:
    claude: opus
    codex: gpt-5.6-luna
  judge_reasoning_efforts:
    codex: low
  timeout_seconds: 120

# Smoke test - quick sanity check
smoke_test:
  name: basic_response
  prompt: "What is 2+2?"
  model: haiku
  max_turns: 1
  assertions:
    output_contains:
      - "4"
