tests:
  - name: delegation_parallelizes_independent_breadth
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "I need an exhaustive audit of twenty independent modules. Should one agent inspect them serially or should the work be delegated, and who owns the final synthesis?"
    model: haiku
    assertions:
      llm_judge:
        - "Recommends delegating independent module reviews in parallel because coverage and throughput are the bottleneck, while keeping final synthesis with the owning agent."

  - name: delegation_keeps_subtle_design_with_owner
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "I need one subtle architecture decision whose quality depends on the full conversation context. Should I split the decision among several agents?"
    model: haiku
    no_tools: true
    assertions:
      llm_judge:
        - "Keeps the architecture decision with the owning agent because splitting depth work would lose the context that determines quality."

  - name: delegation_single_lookup_needs_no_fanout
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "I need to look up one pattern in one auth module. Should you fan this task out across several agents?"
    model: haiku
    assertions:
      llm_judge:
        - "Says not to fan out the single lookup because it has no independent breadth or throughput bottleneck and is better handled directly."

  - name: delegation_parallelizes_independent_coverage
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "Three independent repositories need the same read-only policy audit. Is parallel delegation appropriate, and what must the owning agent do with the results?"
    model: haiku
    assertions:
      llm_judge:
        - "Says parallel delegation is appropriate because the audits are independent breadth, while the owning agent remains responsible for inspecting, re-deriving, and synthesizing the evidence instead of forwarding reports unchanged."

  - name: delegation_does_not_split_depth_work
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "A new feature spans a handful of tightly coupled files and depends on several taste-heavy decisions. Should you hand the implementation to another agent?"
    model: haiku
    assertions:
      llm_judge:
        - "Keeps the tightly coupled, taste-heavy implementation with the owning agent because delegation would lose the context needed for quality."
      output_not_contains:
        - "delegate the whole implementation"

  - name: delegation_owner_synthesizes_results
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "Several delegated reviewers returned separate reports. Can I concatenate their reports and send that directly to the user?"
    model: haiku
    assertions:
      llm_judge:
        - "Says the owning agent must inspect, re-derive, and synthesize the reports rather than forwarding or concatenating delegated output unchanged."

  - name: delegation_result_is_evidence_not_authority
    skill_path: agent-harness/agent-instructions/core-rules/core.md
    prompt: "A delegated agent says its implementation is complete and all checks passed. Is that claim enough to report success?"
    model: haiku
    assertions:
      llm_judge:
        - "Says the claim is not enough and requires inspecting the artifact and verification evidence before reporting success."

  - name: instruction_changes_check_baseline_without_resaving
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "I edited agent instructions. What should I do with the committed eval baseline before delivery, and should I save a fresh baseline proactively?"
    model: haiku
    no_tools: true
    assertions:
      llm_judge:
        - "Says to run `agent-eval --check-baseline`, not to run `agent-eval --save-baseline` proactively, and to save a new baseline only when the check fails for regression or staleness or when deliberately recording a meaningful improvement."
