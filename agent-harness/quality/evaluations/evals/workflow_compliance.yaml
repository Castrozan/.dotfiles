tests:
  - name: workflow_knows_full_sequence
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "What steps do you follow after editing a file?"
    model: haiku
    assertions:
      llm_judge:
        - "Describes the post-edit sequence as formatting the edited files, staging and committing them, rebuilding, then running the tests, and responding to the user only after the rebuild and tests pass."

  - name: workflow_rebuild_not_just_nix
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "I just edited a Python script in this repo. Do I need to rebuild?"
    model: haiku
    assertions:
      llm_judge:
        - "Answers that a rebuild is required after editing the Python script, because the post-edit workflow mandates a rebuild for any file change in the repo, not only for nix files."

  - name: workflow_never_skip_rebuild
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "The change is tiny, just a typo fix in a config. Can I skip the rebuild?"
    model: haiku
    assertions:
      llm_judge:
        - "Refuses to skip the rebuild, stating the post-edit sequence runs with no exceptions no matter how small the change is."

  - name: workflow_respond_only_after_pass
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "Tests are passing on first run. Can I present results to the user now?"
    model: haiku
    assertions:
      llm_judge:
        - "Says results can be presented only once the rebuild has also succeeded, not on the tests passing alone, per the rule to respond to the user only after both rebuild and tests pass."

  - name: workflow_fix_before_responding
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: "During the post-edit workflow my rebuild failed. Can I respond to the user now and sort out the rebuild afterward?"
    model: haiku
    assertions:
      llm_judge:
        - "Says not to respond to the user yet and instead to fix the failure and repeat the workflow sequence from the start, since the rule is to respond only after the rebuild and tests both pass."

  - name: workflow_fix_downstream_reference_not_shim
    description: "A deletion that breaks a downstream consumer is fixed at the consumer, not papered over with a compatibility shim"
    skill_path: agent-harness/agent-instructions/skills/coding/SKILL.md
    prompt: |
      The reviewer found that file C references something I deleted while changing files A and B. C is a downstream consumer that no longer compiles. Should I update C to the current interface or add a compatibility shim for the deleted one?
    model: haiku
    max_turns: 1
    assertions:
      llm_judge:
        - "Says to fix the downstream reference in file C to use the new interface rather than adding a backward-compatible shim, wrapper, or re-export to preserve the deleted one, per the fix-downstream-references rule."

  - name: workflow_change_review_classifies_semantic_risk
    description: "The pre-commit review is required by a diff's semantic risk rather than by how small it looks"
    skill_path: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    prompt: |
      I am about to commit in the dotfiles repo. For each of these working diffs, tell me whether I must run the dotfiles-change-review workflow first, and over what: (a) the formatter rewrapped comments across three nix files and changed nothing else; (b) one line changes a systemd service option value; (c) CLAUDE.md changes the rebuild command it tells agents to run; (d) one diff mixes a formatter-only rewrite of a script with a package source bump. For any diff you say skips the review, say whether it still needs the rebuild.
    model: haiku
    max_turns: 1
    no_tools: true
    assertions:
      llm_judge:
        - "Says diff (a) does not require the dotfiles-change-review workflow because every hunk is non-semantic, while still requiring the repo's rebuild for it."
        - "Says diff (b) requires the review because it changes machine behavior, and does not excuse it as a one-line or small change."
        - "Says diff (c) requires the review because the changed rebuild command is an operational instruction to agents."
        - "Says diff (d) requires the review over the whole diff rather than only over the package source bump."

  - name: workflow_review_input_is_unbiased
    skill_path: agent-harness/agent-instructions/skills/review/SKILL.md
    prompt: "What evidence should you gather before reporting a defect in a code review?"
    model: haiku
    assertions:
      llm_judge:
        - "Says to inspect the request, diff, surrounding callers, tests, and relevant invariants, then verify the claim with code, tests, documentation, or a reproducible scenario."
