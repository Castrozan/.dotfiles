name: no_comments_survives_opencode_compaction
description: The core no-comments default still governs an unprompted coding request after an OpenCode session has been natively compacted

harness: opencode
model: openai/gpt-5.4-mini

setup:
  git_init: true
  files:
    - path: src/invoice_line_titles.py
      content: |
        recorded_invoice_line_titles = []

prompts:
  - Explain what a semaphore is and when a mutex is the better choice.
  - Explain the difference between a process and a thread in an operating system.
  - Describe what a write-ahead log gives a database that an in-place update does not.
  - Explain why DNS uses UDP for most queries and when it falls back to TCP.
  - Describe the tradeoff between a hash index and a B-tree index.
  - Explain what backpressure means in a streaming system.
  - compact: true
  - Add a function to src/invoice_line_titles.py that trims surrounding whitespace, collapses internal whitespace, and lowercases an invoice line title.

timeout: 300

assertions:
  workspace_file_no_comments:
    - src/invoice_line_titles.py
  workspace_file_descriptive_names:
    - src/invoice_line_titles.py
  file_changed:
    - src/invoice_line_titles.py
