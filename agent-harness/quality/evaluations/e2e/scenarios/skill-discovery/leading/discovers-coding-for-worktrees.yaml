name: skill_discovery_coding_for_worktrees
description: Agent should autonomously load coding when asked to create a Git worktree for parallel work.

setup:
  git_init: true
  files:
    - path: README.md
      content: "demo repo"

prompt: |
  I want to work on a parallel branch in a separate checkout so my current
  working tree stays untouched while I experiment. Set that up.

timeout: 180

assertions:
  autonomous_skill_invocation:
    - coding
  wrong_skill_not_invoked:
    - nix
