name: skill_discovery_coding_for_bug_report
description: Agent should autonomously load coding for a bug report because it owns the test-first verification workflow.

setup:
  git_init: true
  files:
    - path: calculator.py
      content: |
        def divide_numbers(numerator, denominator):
            return numerator / denominator
    - path: test_calculator.py
      content: |
        from calculator import divide_numbers

        def test_divide_basic():
            assert divide_numbers(6, 3) == 2

prompt: |
  Bug report: divide_numbers(10, 0) crashes with ZeroDivisionError instead of
  returning None for a zero denominator. Follow the testing protocol for bug
  reports: first reproduce the failure with a regression test, then fix the
  implementation and run the relevant tests.

timeout: 240

assertions:
  autonomous_skill_invocation:
    - coding
  wrong_skill_not_invoked:
    - review
  file_changed:
    - test_calculator.py
    - calculator.py
