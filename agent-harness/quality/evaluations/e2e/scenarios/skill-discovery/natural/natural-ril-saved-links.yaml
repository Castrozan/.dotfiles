name: skill_discovery_natural_ril_saved_links
description: Natural-prompt variant. User asks about the links they saved with no hint about ril, the vault, or the capture inbox. Agent should still route to the ril skill.

setup:
  git_init: false
  files: []

prompt: |
  What did I save to read later? Let's actually do something with it.

timeout: 180

assertions:
  autonomous_skill_invocation:
    - ril
  wrong_skill_not_invoked:
    - nix
    - review
