name: skill_discovery_natural_coding_calculator_divide_zero
description: User reports a bug with no workflow hints. Agent should route to coding, test first, and add no comments.

setup:
  git_init: true
  files:
    - path: calculator.py
      content: |
        def divide_numbers(numerator, denominator):
            return numerator / denominator
    - path: test_calculator.py
      content: |
        from calculator import divide_numbers

        def test_divide_basic():
            assert divide_numbers(6, 3) == 2

prompt: |
  There's a bug in calculator.py where divide crashes on zero. Fix it.

timeout: 240

assertions:
  autonomous_skill_invocation:
    - coding
  wrong_skill_not_invoked:
    - review
  workspace_file_no_comments:
    - calculator.py
    - test_calculator.py
  file_changed:
    - test_calculator.py
    - calculator.py
