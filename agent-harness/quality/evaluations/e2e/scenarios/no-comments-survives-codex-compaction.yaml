name: no_comments_survives_codex_compaction
description: The core no-comments default still governs an unprompted coding request after a Codex session has been natively compacted

harness: codex

setup:
  git_init: true
  files:
    - path: src/ledger_entry_labels.py
      content: |
        recorded_ledger_entry_labels = []

prompts:
  - Explain what a semaphore is and when a mutex is the better choice.
  - Explain the difference between a process and a thread in an operating system.
  - Describe what a write-ahead log gives a database that an in-place update does not.
  - Explain why DNS uses UDP for most queries and when it falls back to TCP.
  - Describe the tradeoff between a hash index and a B-tree index.
  - Explain what backpressure means in a streaming system.
  - compact: true
  - Add a function to src/ledger_entry_labels.py that trims surrounding whitespace, collapses internal whitespace, and lowercases a ledger entry label.

timeout: 300

assertions:
  workspace_file_no_comments:
    - src/ledger_entry_labels.py
  file_changed:
    - src/ledger_entry_labels.py
