categoria: skill_routing
casos:
  - nome: routing_to_machine_resources
    nivel: unidade
    system_prompt: &catalogo |
      You are a skill router. Given a user request, respond with the exact name of the single most appropriate top-level skill from the list below. Nested capability names inside a description are not valid answers. A request for a capability indexed by all-skills routes to all-skills, which then loads the nested skill. Respond with ONLY the top-level skill name, nothing else.
      Available skills:

      all-skills - Route requests for these indexed capabilities to all-skills, then load the nested skill it names: agent-api, arr-stack, avatar, ci-watcher, desktop, frontend-design, home-assistant, machine-resources, media-generation, notify, obsidian, page-composer, passwords, phone-status, quickshell, ril, security-audit, todo, twitter, youtube

      agent-session - Restart, compact, or exit the current Claude Code, Codex, or OpenCode session from inside it. Use to apply a configuration change, resume work without waiting for input, compact context, or end a finished session.

      architecture - Boundaries, dependency direction, system design, UML and deployment shape. Use when choosing a structure, adding a module or service, moving a boundary, or reviewing a design.

      browser - Control browser pages and Electron apps through Chrome DevTools CLI or eligible OpenCLI workflows. Not for desktop capture, media, or other GUI.

      coding - Implement and evolve code safely. Use for coding, fixes, tests, implicit state machine audits, commits, Git history and archaeology, or parallel branch work.

      deep-work - Persist task context to disk so big or compaction-prone work survives across sessions. Use for work over ~5 steps, spanning sessions, or when explicitly asked to preserve context; not for quick fixes.

      deliver - Drive a software goal end-to-end: investigate context, design the build process, author a goal prompt, then execute with workflows and subagents until it works live. For big objectives needing a process, not one-off tasks.

      devenv - Enter a project's devenv shell, run commands, update its lock, or clear stale state. Use when a repository carries devenv configuration and needs its toolchain on PATH.

      docs - Documentation standards for when a doc earns its place, what never to write, evergreen phrasing, and policy shape. Use when writing or judging a README, doc, or policy; for authoring AI instruction files read instructions.

      explore - Search current code across text, files, callers, and context in three cycles. Use for repo sweeps, not Git history.

      forge - Manage pull requests, merge requests, reviews and hosted CI using the repository's Git hosting provider.

      goal-prompt - Write a one-line prompt under 3.5k characters for an autonomous or scheduled agent. Use for routine, cron, remote-trigger, or other one-field runs.

      herdr - Operate herdr workspaces, tabs, panes, processes, and persistent interactive agent sessions. Use for layout, process control, inspection, input, waiting, and takeover.

      humanize - Use when writing for people outside a live session, like READMEs, PR or MR descriptions, handoffs, chat messages, emails, long-lived docs, bug reports, status updates, release notes. Not for live session replies.

      instructions - Authoring AI instruction surfaces - SKILL.md, agent definitions, CLAUDE.md policies, and subagent briefs. Use when writing or editing any file that instructs an AI.

      orchestrate - Delegate same-goal work to another interactive agent, harness, or machine over a2a, herdr, or ssh. Use to spawn parallel peers, dispatch, observe, correct, and repeat.

      process-design - Co-design multi-step, multi-agent processes by composing capability blocks from a toolbox (agents, deterministic tools, monitors, gates, memory), redrawing with the human each round, then suggesting a dry run. Use before orchestrating complex agent work.

      research - Research current external information, comparisons, decisions, or themed digests. Use for latest facts, evaluation, verification, "catch me up", or community pulses; not local repository search.

      review - Review code, configurations, AI instructions, or completed work for actionable defects, regressions, security risks, and compliance gaps. Use when inspecting a diff, auditing an instruction surface, or verifying delivery.

      url-shortener - Shorten long public URLs into verified plain links for terminal and keyboard workflows.

      wellput - Use for substantial replies in active agent sessions; exclude file authoring.

      workspace - Switch the Bash working directory to another repo or directory for the session. Use when work must run commands outside the primary repo.
    pergunta: My laptop is swapping and the fans are loud, what is eating my memory?
    assercoes:
      igual:
        - all-skills
