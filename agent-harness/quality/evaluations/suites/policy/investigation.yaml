categoria: investigation
casos:
  - nome: why_question_triggers_investigation
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      'The user asked: "why does module A reference module B?" I think I remember the answer from earlier in the conversation.
      Should I just tell them what I remember?

      '
    assercoes:
      juiz:
        - Says not to answer from memory alone and to read the actual code first, because a 'why' question is an investigation
          trigger whose deliverable is understanding.
  - nome: why_two_files_requires_reading_both
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      'A teammate is about to answer the user''s question "why does this repo have both usage_snapshot_writer.py and
      current_usage_snapshot.py, and how do they relate?" purely from the two file names, without opening either file. Is that
      acceptable here, and what should they do instead?

      '
    assercoes:
      juiz:
        - Says answering from the file names alone is not acceptable and that both files have to be read first, because the answer
          has to rest on the actual code rather than an assumption.
  - nome: evidence_before_conclusions
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      "I read a SKILL.md file and noticed several things that look wrong. I haven't checked any actual files, deployment
      configs, or how agents use it in practice. Should I present my findings to the user now?

      "
    assercoes:
      juiz:
        - Says not to present the findings yet and to first verify them against the actual files, deployment configuration, or
          real usage, because the deliverable is understanding rather than a list of suspicions.
  - nome: investigation_traces_to_instructions
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      "An agent used the browser skill when it should have used all-skills to reach the indexed obsidian skill. The
      user had to correct it. What should I investigate to understand why this happened?

      "
    assercoes:
      juiz:
        - Directs the investigation at the instruction surface that caused the wrong choice, naming the skill descriptions, their
          routing triggers, or which instructions were loaded, instead of only restating the symptom.
  - nome: investigation_keeps_plan_provisional
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      "I formed an initial plan after reading the main files, but implementation evidence now contradicts one of its
      assumptions. Should I keep following the original plan because investigation already ended?

      "
    assercoes:
      juiz:
        - Says the plan is provisional and must be revised when implementation evidence changes the model rather than preserved
          as a completed investigation decision.
  - nome: investigation_depth_matches_stakes
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      "An agent failed at a task that spanned three different skills. It loaded the wrong skill, used broken tools,
      and dismissed user content. I've read the one SKILL.md file that was directly involved. Is that enough investigation?

      "
    assercoes:
      juiz:
        - Answers that reading the single SKILL.md is not enough, and that the investigation has to cover the other skills and
          failure modes involved before concluding.
  - nome: never_analyze_in_isolation
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      "I need to evaluate whether an instruction skill is working well. I've read the SKILL.md file. What else should
      I check before concluding?

      "
    assercoes:
      juiz:
        - Names evidence beyond the document itself, such as the artifacts the skill actually produces, how agents use it in practice,
          or its tests and evals.
