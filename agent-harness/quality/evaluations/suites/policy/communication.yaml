categoria: communication
casos:
  - nome: representation_ownership_uses_tree
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Treat this as a complete hypothetical layout and do not inspect any files. Explain it so I can quickly see who

      owns request parsing, session state, and transport:

      src/commands/parse.py, src/sessions/store.py, src/transport/client.py.

      "
    assercoes:
      juiz:
        - Uses a compact tree as the main representation, retains the supplied file nesting, and identifies request parsing, session
          state, and transport ownership on each corresponding file or its containing directory. Structural root and intermediate
          directories need no additional label.
  - nome: representation_ordering_and_failure_uses_sequence
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Explain the request path from UI to API to database, including that authentication can reject the request before

      the database call and that the UI receives the error.

      "
    assercoes:
      juiz:
        - Uses a compact sequence or flow as the main representation because ordering and the authentication failure path are
          the relationships the reader must inspect.
  - nome: representation_choices_use_table
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Compare SQLite, PostgreSQL, and DynamoDB for local setup, concurrent writes, operational burden, and horizontal

      scaling so I can choose one.

      "
    assercoes:
      juiz:
        - Uses a compact comparison table as the main representation, with the options as one dimension and the requested decision
          criteria as the other.
  - nome: representation_behavior_uses_state_model
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Explain a job that moves from queued to running, may retry after a transient failure, and ends in succeeded or

      failed. A completed job cannot return to running.

      "
    assercoes:
      juiz:
        - Uses a compact state model as the main representation, showing events or transitions and making the invalid completed-to-running
          transition clear.
  - nome: representation_change_uses_focused_diff
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Treat this as a complete hypothetical layout and do not inspect any files. Show how src/transport.py changes
      into

      src/transport/client.py and src/transport/stream.py while the rest of src stays unchanged.

      "
    assercoes:
      juiz:
        - Uses a focused diff as the main representation because the reader needs to inspect a change against an existing file
          layout, and omits unrelated files.
  - nome: representation_single_answer_stays_prose
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta: The service port is 8080. Which port should I connect to?
    assercoes:
      juiz:
        - Answers 8080 directly in one short prose sentence and does not add a table, tree, diagram, diff, headings, or a list.
  - nome: communication_compression_preserves_material_meaning
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Shorten this without changing what an operator may do: Retry the migration at most twice, but only when the

      database reports SQLSTATE 40001. Never retry a permission error. The second retry can increase lock contention.

      "
    assercoes:
      juiz:
        - Produces a shorter version that preserves the two-retry maximum, the SQLSTATE 40001 condition, the prohibition on retrying
          permission errors, and the lock-contention caveat.
  - nome: communication_uses_one_defined_term_per_referent
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Explain this to a new maintainer: the code calls the record that grants one worker temporary ownership a lease.

      The worker must renew the lease every 30 seconds and loses ownership when the lease expires.

      "
    assercoes:
      juiz:
        - Defines lease at first use, then consistently calls the same record a lease rather than rotating through synonyms, while
          preserving the 30-second renewal and expiration behavior.
  - nome: communication_separates_evidence_inference_and_decision
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "The logs prove only that latency rose after the cache deploy. I suspect key churn caused it, but we have no key

      cardinality metric. Tell the incident lead what we know and whether to roll back.

      "
    assercoes:
      juiz:
        - Clearly distinguishes the observed timing correlation from the unverified key-churn hypothesis, then gives a rollback
          recommendation with its practical uncertainty instead of presenting the suspicion as fact.
  - nome: communication_removes_inflation_without_deleting_the_fact
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Rewrite this for an engineering status report: This pivotal migration marks a transformative milestone in our

      journey, showcasing the team's unwavering commitment to a robust and seamless developer ecosystem. It reduced

      median build time from 11 minutes to 7 minutes in the measured CI jobs.

      "
    assercoes:
      juiz:
        - Removes the inflated milestone, journey, commitment, robust, seamless, and ecosystem framing while preserving the measured
          reduction from 11 minutes to 7 minutes and identifying it as CI-job evidence.
  - nome: controlled_language_explains_by_contrast
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Explain this change to an engineer who needs to understand why it reduced work. Before the change, three validators

      each fetched the same 18 files, causing 54 reads. After the change, one collector writes a bundle path and all three

      validators read that same bundle. The validators and their checks did not change.

      "
    assercoes:
      juiz:
        - Uses a compact before-and-after contrast as the main representation, places 54 reads and the shared bundle beside the
          stages that produce or consume them, labels the bundle-path handoff, and states that all three validators and their
          checks remain unchanged without repeating the whole figure in prose.
  - nome: controlled_language_separates_diagnosis_from_evidence
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Write a self-contained incident handoff for the incident lead, starting with your recommended action and then
      its

      supporting evidence.

      HTTP 503 responses appear only on node C and began after its certificate rotated.

      I suspect a stale TLS session cache, but we have no cache trace. Nodes A and B remain healthy. Replacing node C is

      reversible and takes two minutes.

      "
    assercoes:
      juiz:
        - Leads with the reversible action on node C, identifies the node-specific 503s and certificate timing as evidence, labels
          the stale TLS cache as an unverified hypothesis because the cache trace is missing, and preserves that nodes A and B
          are healthy and replacement takes two minutes.
  - nome: controlled_language_decides_by_tradeoff
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Choose between an in-memory queue and a durable queue. The worker may restart during processing, losing an in-memory

      item would charge a customer twice, a durable queue adds 20 ms, and the latency budget has 80 ms of headroom.

      "
    assercoes:
      juiz:
        - Recommends the durable queue because restart loss can double-charge a customer, preserves its 20 ms cost and the 80
          ms available headroom, and does not flatten the in-memory option into an irrational choice or add unrelated criteria.
  - nome: controlled_language_preserves_warning_conditions
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Rewrite this for an operator: After stopping the pump, pressure can remain above 6 bar for 90 seconds. The operator

      must wait for the gauge to reach zero before opening the valve. Opening it early can eject hot fluid.

      "
    assercoes:
      juiz:
        - Puts the hot-fluid hazard before or beside the action it changes, addresses the operator directly or names that actor,
          preserves the above-6-bar condition and 90-second duration, and keeps the required stop, wait for zero, then open sequence.
  - nome: controlled_language_reports_measured_change
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Rewrite this status: Our groundbreaking cache overhaul transformed performance. In the 12 measured production

      requests, median latency fell from 240 ms to 150 ms. We believe database load also fell, but that metric is missing.

      "
    assercoes:
      juiz:
        - Leads with the measured median latency change from 240 ms to 150 ms and its 12-request production scope, removes the
          groundbreaking and transformed claims, and marks lower database load as unverified because its metric is missing.
  - nome: controlled_language_summarizes_for_action
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/writing/humanize/SKILL.md
    pergunta:
      "Give me a TL;DR. The release is deployed to 40 percent of hosts. Error rate is normal there, but memory is 18
      percent

      above baseline. The rollout remains paused until a heap sample identifies whether the increase is bounded.

      "
    assercoes:
      juiz:
        - Leads with keeping the rollout paused, preserves the 40 percent deployment, normal error rate, 18 percent memory increase,
          and heap-sample condition, and adds no background that the operator does not need.
