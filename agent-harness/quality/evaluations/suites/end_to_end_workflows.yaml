    nivel: ponta-a-ponta
    escreve: true
    pergunta:
      "The parse_input_string function in src/parser.py should also handle

      semicolons as delimiters, not just commas. Fix it.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/parser.py
          conteudo: "def parse_input_string(raw_input_string):\n    return raw_input_string.strip().split(\",\")\n"
        - caminho: src/formatter.py
          conteudo: "def format_output_as_pipe_separated(parsed_items):\n    return \" | \".join(parsed_items)\n"
        - caminho: unrelated_file.txt
