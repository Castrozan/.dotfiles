  - nome: investigation_traces_full_call_chain
    nivel: ponta-a-ponta
    escreve: true
    pergunta: "Bug: handle_checkout crashes when cart has items with price 0.

      Find exactly where and why it fails.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/handler.py
          conteudo:
            "from src.service import process_payment\n\ndef handle_checkout(cart):\n    return process_payment(cart[\"\
            items\"], cart[\"user_id\"])\n"
        - caminho: src/service.py
          conteudo:
            "from src.calculator import compute_total\nfrom src.gateway import charge_card\n\ndef process_payment(items,\
            \ user_id):\n    total = compute_total(items)\n    return charge_card(user_id, total)\n"
        - caminho: src/calculator.py
          conteudo: "def compute_total(items):\n    return sum(item[\"price\"] for item in items)\n"
        - caminho: src/gateway.py
          conteudo:
            "CHARGES = []\n\ndef charge_card(user_id, amount):\n    if amount <= 0:\n        raise ValueError(\"invalid\
            \ amount\")\n    charge = {\"user_id\": user_id, \"amount\": amount}\n    CHARGES.append(charge)\n    return charge\n"
    assercoes:
      comandos_executados_proibidos:
        - "cat "
        - "head "
      comandos:
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/handler.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/service.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/calculator.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
