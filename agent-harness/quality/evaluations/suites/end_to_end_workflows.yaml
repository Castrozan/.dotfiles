categoria: end_to_end_workflows
casos:
  - nome: breaking_change_removes_old_function
    nivel: ponta-a-ponta
    escreve: true
    pergunta: "Rename the fetch_user function to retrieve_user_by_id. Update all

      call sites and tests. Do not keep the old name as a wrapper or alias.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/users.py
          conteudo:
            "USERS_DATABASE = {\n    1: {\"name\": \"Alice\", \"email\": \"alice@example.com\"},\n    2: {\"name\": \"\
            Bob\", \"email\": \"bob@example.com\"},\n}\n\ndef fetch_user(user_id):\n    return USERS_DATABASE.get(user_id)\n"
        - caminho: src/api.py
          conteudo:
            "from src.users import fetch_user\n\ndef handle_user_request(user_id):\n    user = fetch_user(user_id)\n \
            \   if not user:\n        return {\"error\": \"not found\"}\n    return {\"user\": user}\n"
        - caminho: tests/test_users.py
          conteudo:
            "from src.users import fetch_user\n\ndef test_fetch_existing_user():\n    user = fetch_user(1)\n    assert\
            \ user[\"name\"] == \"Alice\"\n\ndef test_fetch_missing_user():\n    user = fetch_user(999)\n    assert user is None\n"
    assercoes:
      comandos:
        - executa: git status --porcelain -- src/users.py
          regex: .
        - executa: git status --porcelain -- src/api.py
          regex: .
        - executa: git status --porcelain -- tests/test_users.py
          regex: .
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/users.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/api.py
  - nome: formatting_runs_after_python_edit
    nivel: ponta-a-ponta
    escreve: true
    pergunta:
      "The add_numbers function in calculator.py needs a multiply_numbers

      sibling function. Add it.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: calculator.py
          conteudo:
            "def add_numbers(first_number,second_number):\n    return first_number+second_number\n\ndef subtract_numbers(\
            \ first_number, second_number ):\n    return first_number - second_number\n"
        - caminho: AGENTS.md
          conteudo:
            "Format each changed Python file with ruff format before responding.

            "
        - caminho: CLAUDE.md
          conteudo:
            "Format each changed Python file with ruff format before responding.

            "
    assercoes:
