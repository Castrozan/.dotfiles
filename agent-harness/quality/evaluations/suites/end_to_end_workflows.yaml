      "Refactor src/order_processor.py. The process_order function does too

      much - validation, calculation, and confirmation building. Split it

      into focused functions that each do one thing.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/order_processor.py
          conteudo:
            "def process_order(order_data):\n    email = order_data.get(\"email\")\n    if not email or \"@\" not in email:\n\
            \        raise ValueError(\"invalid email\")\n    items = order_data.get(\"items\", [])\n    if not items:\n     \
            \   raise ValueError(\"no items\")\n    total = 0\n    for item in items:\n        price = item[\"price\"] * item[\"\
            quantity\"]\n        if item.get(\"discount\"):\n            price = price * (1 - item[\"discount\"] / 100)\n    \
            \    total += price\n    tax = total * 0.1\n    total_with_tax = total + tax\n    confirmation = {\n        \"email\"\
            : email,\n        \"items\": len(items),\n        \"subtotal\": total,\n        \"tax\": tax,\n        \"total\":\
            \ total_with_tax,\n        \"status\": \"confirmed\",\n    }\n    return confirmation\n"
    assercoes:
      comandos:
        - executa: git status --porcelain -- src/order_processor.py
          regex: .
        - executa:
