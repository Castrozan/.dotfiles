      not stale documentation.

      "
    tempo_limite_segundos: 180
    ambiente:
      git: false
    assercoes:
      skills_usadas:
        - research
      skills_proibidas:
        - nix
        - browser
  - nome: skill_discovery_natural_coding_calculator_divide_zero
    nivel: ponta-a-ponta
    escreve: true
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/*/*/SKILL.md
    pergunta:
      "There's a bug in calculator.py where divide crashes on zero. Fix it.

      "
    tempo_limite_segundos: 240
    ambiente:
      git: true
      arquivos:
        - caminho: calculator.py
          conteudo: "def divide_numbers(numerator, denominator):\n    return numerator / denominator\n"
        - caminho: test_calculator.py
          conteudo: "from calculator import divide_numbers\n\ndef test_divide_basic():\n    assert divide_numbers(6, 3) == 2\n"
    assercoes:
      skills_usadas:
        - coding
      skills_proibidas:
        - review
      comandos:
        - executa: git status --porcelain -- test_calculator.py
          regex: .
        - executa: git status --porcelain -- calculator.py
          regex: .
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            calculator.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            test_calculator.py
  - nome: skill_discovery_natural_coding_commit_these_changes
