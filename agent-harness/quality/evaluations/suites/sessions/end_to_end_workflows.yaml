categoria: end_to_end_workflows
casos:
  - nome: global_rules_apply_alongside_project_claude_md
    nivel: ponta-a-ponta
    escreve: true
    pergunta:
      "Add a get_user endpoint to src/endpoints.py that accepts a user_id

      parameter and returns a user dict. Import from src/models.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/endpoints.py
          conteudo: "def get_health():\n    return {\"status\": \"ok\"}\n"
        - caminho: src/models.py
          conteudo: "class User:\n    def __init__(self, name, email):\n        self.name = name\n        self.email = email\n"
        - caminho: AGENTS.md
          conteudo: "This is a Python REST API project.

            Use FastAPI patterns. All endpoints return JSON.

            Test with pytest and httpx.

            "
        - caminho: CLAUDE.md
          conteudo: "This is a Python REST API project.

            Use FastAPI patterns. All endpoints return JSON.

            Test with pytest and httpx.

            "
    assercoes:
      comandos:
        - executa: git status --porcelain -- src/endpoints.py
          regex: .
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/endpoints.py
  - nome: skill_discovery_browser_for_webpage
    nivel: ponta-a-ponta
    escreve: true
    instrucao: agent-harness/agent-instructions/skills/workstation/browser/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/*/*/SKILL.md
    pergunta:
      'Open the login page at https://app.example.internal/login, fill in the username

      field with "demo", and click the Sign In button. This is a live authenticated

      web app I need to interact with, not a page to fetch text from.

      '
    tempo_limite_segundos: 180
    ambiente:
      git: false
    assercoes:
      skills_usadas:
        - browser
      skills_proibidas:
        - research
  - nome: skill_discovery_multiple_skills_in_workflow
    nivel: ponta-a-ponta
    escreve: true
    instrucao: agent-harness/agent-instructions/skills/development/coding/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/services/nix/SKILL.md
      - agent-harness/agent-instructions/skills/services/nix/SKILL.md
      - agent-harness/agent-instructions/skills/*/*/SKILL.md
    pergunta:
      "I added jq to home/{base,linux,darwin}/example.nix. Stage that single file, commit with

      a conventional message, then apply the configuration so the package is

      actually installed. What is the full correct workflow?

      "
    tempo_limite_segundos: 180
    ambiente:
      git: true
      arquivos:
        - caminho: flake.nix
          conteudo: '{ description = "demo"; }

            '
        - caminho: home/{base,linux,darwin}/example.nix
          conteudo: "{ pkgs, ... }: { home.packages = [ pkgs.jq ]; }

            "
    assercoes:
      skills_usadas:
        - coding
        - nix
      skills_proibidas:
        - review
  - nome: skill_discovery_research_for_external_info
    nivel: ponta-a-ponta
    escreve: true
    instrucao: agent-harness/agent-instructions/skills/knowledge/research/SKILL.md
    instrucoes_extras:
