    instrucao: agent-harness/agent-instructions/skills/services/nix/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/services/nix/SKILL.md
      - agent-harness/agent-instructions/skills/*/*/SKILL.md
    pergunta: "I just edited a nix file, apply it.

      "
    tempo_limite_segundos: 180
    ambiente:
      git: true
