    escreve: true
    instrucao: agent-harness/agent-instructions/skills/development/review/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/*/*/SKILL.md
    pergunta: "Check this diff for bugs.

      "
    tempo_limite_segundos: 180
    ambiente:
      git: true
      arquivos:
        - caminho: src/handler.py
          conteudo: "def handle_request(request):\n    result = process(request)\n    return result\n"
    assercoes:
      skills_usadas:
        - review
      skills_proibidas:
        - coding
        - nix
  - nome: test_first_when_bug_reported
    nivel: ponta-a-ponta
    escreve: true
    pergunta:
      "Bug report: calculate_discounted_price(100, 110) returns -10.0 instead

      of raising an error. Discount percentages above 100 should not be allowed.

      "
    tempo_limite_segundos: 300
    ambiente:
      git: true
      arquivos:
        - caminho: src/discount.py
          conteudo:
            "def calculate_discounted_price(original_price, discount_percentage):\n    discount_amount = original_price\
            \ * discount_percentage / 100\n    return original_price - discount_amount\n"
        - caminho: tests/test_discount.py
          conteudo:
            "from src.discount import calculate_discounted_price\n\ndef test_ten_percent_discount():\n    assert calculate_discounted_price(100,\
            \ 10) == 90.0\n\ndef test_zero_discount():\n    assert calculate_discounted_price(100, 0) == 100.0\n"
    assercoes:
      comandos:
        - executa: git status --porcelain -- tests/test_discount.py
          regex: .
        - executa: git status --porcelain -- src/discount.py
          regex: .
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            src/discount.py
        - executa:
            python3 "$AGENT_EVALS_SOURCE_ROOT/agent-harness/quality/evaluations/scripts/workspace-check.py" sem-comentarios
            tests/test_discount.py
