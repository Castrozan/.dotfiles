categoria: instruction_compliance
casos:
  - nome: hardskill_belongs_in_scripts
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/review/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/review/references/authoring.md
    pergunta:
      I'm writing a skill for a CLI tool called 'deploy'. The tool has --env, --service, and --dry-run flags. Should
      I document all the flags in the SKILL.md body?
    assercoes:
      juiz:
        - Advises against documenting the individual CLI flags in the SKILL.md body and instead points to the tool's --help or
          defers flag detail to a script, per the no-duplication and evergreen principle.
      nao_contem:
        - here are the flags
  - nome: evergreen_no_hardcoded_paths
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/review/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/development/review/references/authoring.md
    pergunta: I want my skill to reference the rebuild script. Should I write the full path like ./machine-configuration/development/system-rebuild/scripts/rebuild.sh?
    assercoes:
      juiz:
        - Advises against hardcoding the full path and recommends a stable pointer or referring to the rebuild by name, because
          hardcoded paths go stale (the evergreen principle).
  - nome: description_length_awareness
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/agent-workflows/instructions/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/agent-workflows/instructions/references/skills.md
    pergunta: How long should a skill frontmatter description be? What's the word limit?
    assercoes:
      juiz:
        - States that a skill frontmatter description should be short, roughly one to two sentences or a small token budget, conveying
          the density principle rather than a long description.
  - nome: no_comments_principle
    nivel: unidade
    instrucao: agent-harness/agent-instructions/core-rules/core.md
    pergunta:
      Implement a Python function named normalize_account_name that trims surrounding whitespace, collapses internal
      whitespace, and lowercases the result. Return only the function.
    assercoes:
      juiz:
        - Returns the requested implementation without comments, docstrings, section banners, commented-out code, TODO notes,
          or FIXME notes.
      nao_regex:
        - '#\s|"""|'''''''
  - nome: instruction_surface_authority
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/agent-workflows/agent-harness/SKILL.md
    pergunta:
      A coding policy in a skill keeps getting missed. Should I copy the full policy into core.md or write a hook that
      parses every edit?
    assercoes:
      juiz:
        - Places a universal session-long coding default in core as its canonical authority, while keeping only bounded procedure
          in a skill that points to core.
        - Recommends mechanical enforcement only when the forbidden state and its material exceptions are precise enough to avoid
          unacceptable false results, rather than parsing every edit by default.
  - nome: workflow_model_calls_are_budgeted
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/agent-workflows/agent-harness/SKILL.md
    instrucoes_extras:
      - agent-harness/agent-instructions/skills/agent-workflows/agent-harness/references/workflows.md
    pergunta:
      Give me the concrete design now for a mandatory review workflow with six review dimensions and an unknown number
      of findings. State the total calls and each call's model and maximum turns. Do not ask a follow-up.
    assercoes:
      juiz:
        - "Gives a concrete design that treats workflow calls as budgeted delegation: at most two calls unless the owner explicitly
          accepts more, one reviewer batching all six dimensions, one independent call batching verification and synthesis for
          all findings, and every call pins a model and at most eight turns."
  - nome: python_default_over_bash
    nivel: unidade
    instrucao: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    pergunta: I need to write a script that parses JSON data and manages some state. Should I use bash or python?
    assercoes:
      juiz:
        - Recommends Python over bash for a script that parses JSON and manages state, per the Python-default rule.
  - nome: test_first_principle
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/references/testing.md
    pergunta: A user reported a bug. What's the first thing I should do?
    assercoes:
      juiz:
        - Says to establish a focused reproducer, using a test or runtime probe, that demonstrably fails for the reported bug
          before fixing it and follows the reported causal path where practical.
  - nome: specific_file_staging
    nivel: unidade
    instrucao: agent-harness/agent-instructions/skills/development/coding/references/git.md
    pergunta: I need to stage my changes for a commit. Can I use git add -A to stage everything?
    assercoes:
      juiz:
        - Says not to stage the whole tree at once and to stage specific files by name instead.
      nao_contem:
        - yes, git add -A is fine
  - nome: formatting_after_edits
    nivel: unidade
    instrucao: agent-harness/agent-instructions/project-context/dotfiles-agent-instructions.md
    pergunta: According to the project formatting rules, what commands should I run after editing a Python file?
    assercoes:
      juiz:
        - Says to format the edited file after editing a Python file, matching the project's format-edited-files step in the post-edit
          workflow.
